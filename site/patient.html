<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أدويتي — صفحة المريض</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;600&family=Noto+Sans+Bengali:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  :root{
    /* the same proportion as the staff screens: the stone stays at the
       base — here that is the wall and the footer — and everything the
       patient reads sits on render */
    --basalt:#3E423A; --basalt-d:#333730; --pointing:#E4DCC8;
    --render:#F4F1E8; --card:#FDFBF5; --field:#FAF7EE;
    --timber:#9A7550; --timber-d:#7A5936;
    --ivory:#E4D6AE;  --gold:#96774E;
    --green:#4E6B3F;  --cement:#8A907C; --alarm:#B4531F;
    --line:#E4DECD; --line-2:#EFEADC;
    --ink:#2A2E27;  --soft:#79806F;
  }
  body{margin:0;background:var(--render);color:var(--ink);
       font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  /* ======================================================================
     THE PAGE, ph6.62

     It used to be a 560-pixel column with a 56-pixel wall beside it, on
     every screen: on a laptop most of the window was empty, and on a phone
     the labels under the icons were set at 8.5px. Now the page takes the
     room it is given. On a computer the wall carries words a person can
     read, the medicines sit in a grid and the warnings stand beside them;
     on a phone the wall lies along the bottom edge as a tab bar, the
     language button moves to the top, and each card takes the full width.
     ====================================================================== */
  .outer{max-width:none;margin:0;padding:0}
  .frame{overflow:visible}

  .pt{--rail:118px;--wrap:1180px;--r:14px;
      background:var(--render);color:var(--ink);font-size:17px;line-height:1.7;
      display:grid;grid-template-columns:var(--rail) minmax(0,1fr);grid-template-areas:"wall main";
      min-height:100vh;position:relative}
  /* the wall stays on the right in every script: the side it is on is part
     of how the page is recognised */
  .pt[dir="ltr"]{grid-template-columns:minmax(0,1fr) var(--rail);grid-template-areas:"main wall";
                 font-family:'Inter',system-ui,sans-serif}
  .pt.lang-ur{font-family:'Noto Nastaliq Urdu',serif;line-height:2.25}
  /* No webfont is loaded for these: every system that ships the script ships a
     face for it, and the patient page must render on a phone with no data. */
  .pt.lang-ja{font-family:'Yu Gothic','Hiragino Sans','Noto Sans JP','MS Gothic',sans-serif;line-height:1.85}
  .pt.lang-zh{font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC','SimSun',sans-serif;line-height:1.85}
  .pt.lang-bn{font-family:'Noto Sans Bengali',sans-serif}
  .pt.lang-hi{font-family:'Noto Sans Devanagari',sans-serif;line-height:1.7}
  .pt :focus-visible{outline:3px solid #C9A86B;outline-offset:2px}

  /* --- the wall ------------------------------------------------------- */
  .wall{grid-area:wall;position:sticky;top:0;height:100vh;background:var(--basalt);color:#B3B9A9;
        display:flex;flex-direction:column;align-items:stretch;padding:0 0 14px;z-index:20}
  .wall::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.09;
    background-image:repeating-linear-gradient(0deg,transparent 0 30px,var(--pointing) 30px 31px)}
  .dent{display:flex;gap:4px;justify-content:center;padding:10px 0 0;position:relative}
  .dent i{width:5px;height:7px;background:var(--ivory);opacity:.42}
  .wall .nm{position:relative;text-align:center;font-family:'Alexandria',sans-serif;
            color:var(--ivory);font-size:17px;font-weight:700;margin:14px 0 8px;opacity:.95}
  .nav{position:relative;display:flex;flex-direction:column;gap:6px;padding:8px 10px 0;flex:1}
  .nv{width:100%;padding:12px 4px 11px;display:flex;flex-direction:column;align-items:center;gap:7px;
      background:none;border:1px solid transparent;color:#B9BFAF;cursor:pointer;font:inherit;
      border-radius:12px;min-height:72px;transition:background .15s,color .15s}
  .nv:hover{background:rgba(255,255,255,.06);color:var(--ivory)}
  .nv .ic{line-height:0}
  .nv .ic svg{width:26px;height:26px}
  .nv .tx{font-size:12.5px;font-weight:600;line-height:1.3;text-align:center}
  .pt.lang-ur .nv .tx{font-size:12.5px;line-height:1.75}
  .nv.on{background:var(--basalt-d);color:var(--ivory);border-color:rgba(223,206,161,.45)}
  .nv[data-nv="lang"]{order:9;margin-top:auto;border-color:rgba(223,206,161,.2)}

  /* --- the main column ------------------------------------------------ */
  .main{grid-area:main;min-width:0;display:flex;flex-direction:column}
  .wrap{width:100%;max-width:var(--wrap);margin:0 auto;padding:0 36px}

  .top{background:var(--card);border-bottom:1px solid var(--line);position:relative}
  .top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:9px;opacity:.5;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='18' height='9'><path d='M9 0.8 L16.5 4.5 L9 8.2 L1.5 4.5 Z' fill='none' stroke='%2396774E' stroke-width='0.9'/><circle cx='9' cy='4.5' r='1.1' fill='%239A7550'/></svg>");
    background-size:18px 9px}
  .topRow{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:20px 0 14px}
  .top .bn{font-family:'Alexandria',sans-serif;font-size:28px;font-weight:700;color:#2F4A2A;
           direction:rtl;line-height:1.2}
  .top .tag{font-size:14px;margin-top:2px;color:var(--timber)}
  .hdrLang{display:inline-flex;align-items:center;gap:9px;border:1px solid var(--line);background:var(--field);
           color:var(--timber-d);padding:9px 15px;font:inherit;font-size:15px;font-weight:600;cursor:pointer;
           border-radius:999px;min-height:46px;flex-shrink:0}
  .hdrLang:hover{border-color:var(--timber)}
  .hdrLang span{color:var(--ink)}
  .forwho{display:flex;align-items:center;gap:10px;margin:0 0 22px;border:1px solid var(--line);
          border-inline-start:4px solid var(--timber);padding:10px 14px;font-size:14.5px;color:var(--ink);
          background:var(--field);border-radius:10px}
  .forwho svg{flex-shrink:0;color:var(--timber)}

  .body{flex:1;padding:30px 0 56px}
  .view{display:none}.view.on{display:block;animation:viewIn .18s ease-out}
  @keyframes viewIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  h2.sec{font-size:19px;font-weight:700;margin:0 0 14px;display:flex;align-items:center;gap:10px;line-height:1.4}
  h2.sec .mk{width:24px;height:24px;border:1px solid var(--gold);display:grid;place-items:center;flex-shrink:0}
  h2.sec .mk i{width:9px;height:9px;background:var(--timber);transform:rotate(45deg);display:block}

  /* --- my medicines: the cards, with the warnings beside them ---------- */
  .medsLayout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:30px;align-items:start}
  .side{position:sticky;top:20px;display:flex;flex-direction:column;gap:18px}

  .who{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 24px;
       margin-bottom:26px;display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,320px);gap:18px 30px;
       align-items:center;box-shadow:0 1px 0 rgba(42,46,39,.04),0 12px 30px -22px rgba(42,46,39,.45);
       border-top:4px solid var(--timber)}
  .who .nm{font-size:24px;font-weight:700;line-height:1.35}
  .who .sub{font-size:14px;color:var(--soft);margin-top:4px}
  .who .sub:empty,.who .nm:empty{display:none}
  /* ph7.4: identity block, status pill, calm empty and history states */
  .whoId{display:flex;align-items:center;gap:16px;min-width:0}
  .av{flex-shrink:0;width:56px;height:56px;border-radius:50%;background:#2F4A2A;color:#FBF8F1;display:grid;place-items:center;
      font:700 22px/1 'Alexandria','IBM Plex Sans Arabic',sans-serif;box-shadow:inset 0 0 0 3px rgba(224,138,30,.55)}
  .av:empty{display:none}
  .who .sub{display:inline-flex;align-items:center;gap:6px;background:#F4EBDA;color:#5A6553;border-radius:999px;padding:4px 12px;
      font-size:13.5px;margin-top:8px;font-variant-numeric:tabular-nums}
  .pstat{justify-self:end;display:inline-flex;align-items:center;gap:10px;background:#F7F4EC;border:1px solid var(--line);
      color:#5A6553;border-radius:999px;padding:9px 16px;font-size:14.5px;line-height:1.4}
  .pstat::before{content:"";width:9px;height:9px;border-radius:50%;background:#B9B3A3;flex-shrink:0}
  .pstat[hidden]{display:none}
  .med.empty{align-items:center;text-align:center;padding:34px 24px 28px;gap:12px;border-top:1px solid var(--line);
      background:linear-gradient(180deg,#FFFDF8,#FBF8F1)}
  .med.empty .eIc{width:64px;height:64px;border-radius:50%;background:#EEF2E8;color:var(--green);display:grid;place-items:center}
  .med.empty .eIc svg{width:30px;height:30px}
  .med.empty .eT{font-size:18px;font-weight:700;color:var(--ink);line-height:1.5;margin:0}
  .med.empty .eAct{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:6px}
  .med.empty .eBtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;color:var(--ink);
      font:inherit;font-size:14.5px;font-weight:600;border-radius:999px;padding:10px 18px;cursor:pointer}
  .med.empty .eBtn:first-child{background:var(--green);border-color:var(--green);color:#fff}
  .med.empty .eBtn svg{width:18px;height:18px}
  .pastList{grid-column:1/-1;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .pastRow{display:flex;align-items:center;gap:14px;padding:14px 18px;border-top:1px solid var(--line)}
  .pastRow:first-child{border-top:0}
  .pastRow .pIc{flex-shrink:0;width:40px;height:40px;border-radius:10px;background:#F4EBDA;color:#B4531F;display:grid;place-items:center}
  .pastRow .pIc svg{width:20px;height:20px}
  .pastRow .pN{font-size:16px;font-weight:600;line-height:1.45;flex:1;min-width:0;overflow-wrap:anywhere}
  .pastRow .pD{font-size:13.5px;color:var(--soft);white-space:nowrap;font-variant-numeric:tabular-nums}
  .pt.phone .av{width:46px;height:46px;font-size:18px}
  .pt.phone .pstat{justify-self:start}
  .prog .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:14px;margin-bottom:8px;color:var(--soft)}
  .prog .row #progVal{font-size:19px;font-weight:700;color:var(--green)}
  .prog .bar{height:12px;background:var(--field);border:1px solid var(--line);border-radius:999px;position:relative;overflow:hidden}
  .prog .bar i{position:absolute;inset-block:0;inset-inline-start:0;background:var(--green);display:block;border-radius:999px}

  #meds{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:20px;align-items:start}
  #meds > h2.sec{grid-column:1/-1;margin:14px 0 0}

  .med{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--timber);
       border-radius:var(--r);padding:20px 22px 22px;display:flex;flex-direction:column;gap:14px;
       box-shadow:0 1px 0 rgba(42,46,39,.04),0 12px 30px -22px rgba(42,46,39,.45)}
  .medHead{display:flex;gap:14px;align-items:center}
  .medIc{flex-shrink:0;width:52px;height:52px;border-radius:12px;background:var(--field);border:1px solid var(--line);
         display:grid;place-items:center;color:var(--timber-d)}
  .med .nm{font-size:22px;font-weight:700;line-height:1.3;margin:0}
  .med .strength{font-size:14px;color:var(--soft);margin-top:2px}
  .med .look{font-size:15.5px;color:var(--soft);line-height:1.75;margin:0}
  .med.past{border-top-color:#C7C0AE;box-shadow:none;padding:16px 20px;gap:4px}
  .med.past .nm{font-size:16.5px}
  .med.empty{border-top-color:var(--line);box-shadow:none}

  .dose{display:flex;gap:14px;align-items:flex-start;background:#EDF2E7;border:1px solid #D1DCC5;
        border-radius:12px;padding:14px 16px}
  .dose .ic{flex-shrink:0;width:40px;height:40px;border-radius:50%;background:var(--green);color:#fff;
            display:grid;place-items:center}
  .dose .tx{font-size:18.5px;font-weight:700;line-height:1.6;color:#22331B}
  .missed{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);background:var(--field);
          border-radius:12px;padding:12px 14px}
  .missed .ic{flex-shrink:0;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;
              display:grid;place-items:center;color:var(--timber-d)}
  .missed .h{font-weight:700;font-size:15px;color:var(--timber-d)}
  .missed .b{font-size:15.5px;line-height:1.75}
  .say{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;padding:10px 18px;
    border:1px solid #C7C0AE;border-radius:999px;background:#fff;color:#1C2B1A;
    font:inherit;font-size:15.5px;font-weight:600;cursor:pointer;min-height:46px}
  .say:hover{border-color:var(--timber)}
  .say:active{background:#F2EFE6}
  .mwarn{border:1px solid #E6CBB4;background:#FBF1E8;border-inline-start:4px solid var(--alarm);
         border-radius:12px;padding:12px 14px}
  .mwarn .t{font-weight:700;color:var(--alarm);font-size:15px;margin-bottom:4px}
  .mwarn ul{margin:0;padding-inline-start:20px;font-size:15.5px;line-height:1.8}

  /* the official leaflet: a card of its own with a real button, not an
     underlined line lost at the foot of a warning box */
  .leaf{border:1px solid #D9D2BF;background:#F7F5EF;border-radius:12px;padding:14px 16px}
  .leaf .lh{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15.5px;color:#2B2E28}
  .leaf .lh svg{flex-shrink:0;color:var(--timber-d)}
  .leaf .lb{font-size:14.5px;color:var(--ink);line-height:1.75;margin-top:6px}
  .leaf .lg{font-size:13.5px;color:var(--soft);line-height:1.7;margin-top:6px}
  .leafBtn{display:inline-flex;align-items:center;gap:8px;margin-top:11px;padding:10px 16px;border-radius:999px;
           background:#fff;border:1px solid #C7C0AE;color:#1C2B1A;font-weight:700;font-size:14.5px;
           text-decoration:none;min-height:44px;max-width:100%}
  .leafBtn:hover{border-color:var(--timber)}
  .leafBtn small{font-weight:500;color:var(--soft);font-size:12.5px}

  .warn{background:#FBF1E8;border:1px solid #E6CBB4;border-inline-start:4px solid var(--alarm);
        border-radius:var(--r);padding:16px 18px}
  .warn .t{font-weight:700;color:var(--alarm);font-size:16px;margin-bottom:8px}
  .warn ul{margin:0;padding-inline-start:20px;font-size:15.5px;line-height:1.85}
  .warn ul:empty{display:none}

  .quick{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .qa{display:flex;align-items:center;gap:13px;width:100%;padding:15px 18px;background:none;border:none;
      border-bottom:1px solid var(--line-2);font:inherit;font-size:16px;font-weight:600;color:var(--ink);
      cursor:pointer;text-align:start;min-height:62px}
  .qa:last-child{border-bottom:none}
  .qa:hover{background:var(--field)}
  .qa .ic{flex-shrink:0;width:40px;height:40px;border-radius:10px;background:var(--field);border:1px solid var(--line);
          display:grid;place-items:center;color:var(--timber-d)}
  .qa .ic svg{width:22px;height:22px}
  .qa .go{margin-inline-start:auto;color:var(--soft);line-height:0}
  .pt[dir="rtl"] .qa .go svg{transform:scaleX(-1)}

  /* --- how to use ----------------------------------------------------- */
  #hows{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:20px;align-items:start}
  /* a real film takes the whole row; its written steps wait behind a button so the page
     stays calm — the film first, the text for whoever needs it */
  #hows .vid.wide{grid-column:1/-1}
  /* the main film is square (it suits phones best); the sign-language edition is wide */
  #hows .vid.wide .poster.big{max-width:620px;margin-inline:auto;aspect-ratio:1/1}
  .vid{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--cement);
       border-radius:var(--r);padding:18px 20px 20px;
       box-shadow:0 1px 0 rgba(42,46,39,.04),0 12px 30px -22px rgba(42,46,39,.45)}
  .vid .vt{font-size:19px;font-weight:700;margin-bottom:2px}
  .vid .vs{font-size:13.5px;color:var(--soft);margin-bottom:12px}
  /* a still with a play button, never autoplay: the patient is standing in
     a pharmacy on their own data */
  .poster{position:relative;background:var(--basalt);aspect-ratio:16/9;display:grid;place-items:center;
          overflow:hidden;border-radius:10px}
  .poster::before{content:"";position:absolute;inset:0;opacity:.14;
    background-image:repeating-linear-gradient(0deg,transparent 0 22px,var(--pointing) 22px 23px)}
  .poster .pl{position:relative;width:64px;height:64px;border:2px solid var(--ivory);border-radius:50%;
              display:grid;place-items:center;color:var(--ivory)}
  .poster .reserved{position:absolute;left:0;right:0;bottom:0;background:rgba(223,206,161,.94);
    color:#2B2E28;font-size:12.5px;font-weight:600;padding:7px 10px;text-align:center;line-height:1.5}
  .poster .dur{position:absolute;top:10px;inset-inline-end:10px;background:rgba(0,0,0,.6);
               color:#fff;font-size:12px;padding:2px 8px;border-radius:6px}
  .poster.has{width:100%;padding:0;border:0;cursor:pointer;font:inherit;display:grid;place-items:center}
  .poster.has::before{display:none}
  .poster.has img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .poster.has .pl{background:rgba(36,57,31,.78);box-shadow:0 6px 18px rgba(0,0,0,.35)}
  .poster.has:hover .pl,.poster.has:focus-visible .pl{transform:scale(1.06)}
  .poster.has::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,22,15,.08),rgba(18,22,15,.32))}
  .poster.has .pl,.poster.has .cta,.poster.has .dur{z-index:1}
  .poster.big .pl{width:84px;height:84px;border-width:3px}
  .poster.big .pl svg{width:30px;height:30px}
  .poster .cta{position:absolute;bottom:12px;inset-inline-start:50%;transform:translateX(-50%);background:rgba(36,57,31,.86);
    color:#fff;font-size:14px;font-weight:700;padding:6px 14px;border-radius:999px;white-space:nowrap}
  [dir=rtl] .poster .cta{transform:translateX(50%)}
  .filmActions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:14px auto 0;max-width:980px}
  .chip{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;border:1px solid var(--gold);
    background:var(--field);color:var(--timber-d);font:inherit;font-size:15px;font-weight:700;cursor:pointer;line-height:1.4}
  .chip svg{flex-shrink:0}
  .chip:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  .chip[aria-expanded="true"]{background:#2F4A2A;border-color:#2F4A2A;color:#fff}
  .chip.soon{cursor:default;opacity:.62;border-style:dashed}
  .filmSteps{max-width:980px;margin:14px auto 0;padding-top:4px;border-top:1px solid var(--line-2)}
  .filmSteps[hidden]{display:none}
  /* the film opens on its own dark stage, as large as the screen allows — no dependence on the
     browser's own full-screen, which some tablets show as a black screen */
  .fmodal{position:fixed;inset:0;z-index:9999;background:#12160F;display:flex;flex-direction:column;color:#fff}
  .fmodal .fbar{display:flex;align-items:center;gap:12px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top))}
  .fmodal .ftitle{flex:1;font-size:16px;font-weight:700;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fmodal .fx{flex-shrink:0;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:999px;
    padding:9px 15px;font:inherit;font-size:15px;font-weight:700;cursor:pointer}
  .fmodal .fx:focus-visible{outline:3px solid #E4D6AE;outline-offset:2px}
  .fmodal .fx[aria-pressed="true"]{background:#E4D6AE;color:#24391F}
  .fmodal .fstage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 8px}
  @media (orientation:portrait){.fmodal .fstage{align-items:flex-start;padding-top:6px}}
  /* the player's own controls sit in a strip under the picture, never over the subtitles */
  .fmodal video{width:100%;height:100%;object-fit:contain;object-position:center top;background:#000;display:block}
  .fmodal .fbar2{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:10px 14px;padding-bottom:max(12px,env(safe-area-inset-bottom))}
  html.filmOpen,html.filmOpen body{overflow:hidden}
  .stepsHead{font-size:14.5px;font-weight:700;color:var(--timber-d);margin:16px 0 4px}
  .vsteps{margin:0;padding:0;list-style:none;counter-reset:v}
  .vsteps li{counter-increment:v;display:flex;gap:12px;align-items:flex-start;padding:10px 0;
             border-bottom:1px solid var(--line-2);font-size:16px;line-height:1.65}
  .vsteps li:last-child{border:none;padding-bottom:0}
  .vsteps li::before{content:counter(v);flex-shrink:0;width:30px;height:30px;border-radius:50%;
    background:var(--field);border:1px solid var(--gold);
    display:grid;place-items:center;font-size:13.5px;font-weight:700;color:var(--timber-d)}
  .vnote{font-size:13.5px;color:var(--soft);margin-top:12px;padding-top:11px;
         border-top:1px solid var(--line-2);line-height:1.75}

  /* --- ask the pharmacist: a conversation, with the rules beside it ---- */
  .askGrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;align-items:start}
  .ask{display:flex;flex-direction:column;gap:12px}
  .askInfo{display:flex;flex-direction:column;gap:14px;position:sticky;top:20px}
  .infoCard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
  .hours{font-size:15px;color:var(--soft);line-height:1.8}
  .hours b{color:var(--ink);display:block;font-size:17px}
  .emerg{background:#FDECE4;border:1px solid #E9C6B2;border-inline-start:4px solid var(--alarm);
         border-radius:var(--r);padding:14px 16px;font-size:15.5px;color:#8A3E14;font-weight:700;line-height:1.7}
  .thread{display:flex;flex-direction:column;gap:10px;background:#fff;border:1px solid var(--line);
          border-radius:var(--r);padding:18px;min-height:240px;max-height:62vh;overflow:auto}
  .msg{align-self:flex-end;max-width:82%;background:#E8EFE1;border:1px solid #D3DEC8;border-radius:16px;
       padding:10px 14px;font-size:16px;line-height:1.7;word-wrap:break-word}
  .msg.rx{align-self:flex-start;background:var(--field);border-color:var(--line)}
  .msg .who2{font-size:12.5px;color:var(--soft);margin-bottom:3px}
  .msg.rx .who2{color:var(--green);font-weight:700}
  /* a line with no sender is the page speaking, not the pharmacist */
  .msg.rx:not(:has(.who2)){align-self:center;background:none;border:none;color:var(--soft);
       font-size:15px;text-align:center;max-width:100%}
  .ta{width:100%;border:1px solid var(--line);background:#fff;border-radius:var(--r);
      padding:14px 16px;font:inherit;font-size:16.5px;min-height:110px;color:var(--ink);resize:vertical}
  .ta:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(78,107,63,.15)}
  .btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;border:none;background:var(--green);color:#fff;
       padding:15px 20px;font:inherit;font-size:17px;font-weight:700;cursor:pointer;border-radius:12px;min-height:56px}
  .btn:hover{filter:brightness(1.06)}
  .btn[disabled]{opacity:.55;cursor:default;filter:none}
  .btn.wood{background:var(--timber-d)}
  .btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--ink)}

  /* --- refill: where the request has reached, as a path --------------- */
  .refill{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--timber);
          border-radius:var(--r);padding:24px;max-width:820px}
  .state{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin:4px 0 24px;counter-reset:s;position:relative}
  .st{counter-increment:s;position:relative;text-align:center;font-size:14.5px;color:var(--soft);padding-top:50px;
      font-weight:600;line-height:1.5}
  .st::before{content:counter(s);position:absolute;top:0;left:50%;transform:translateX(-50%);width:40px;height:40px;
      border-radius:50%;background:var(--field);border:2px solid var(--line);display:grid;place-items:center;
      font-weight:700;color:var(--soft);z-index:1}
  .st::after{content:"";position:absolute;top:19px;inset-inline-start:50%;width:100%;height:2px;background:var(--line)}
  .st:last-child::after{display:none}
  .st.on{color:var(--ink)}
  .st.on::before{background:var(--green);border-color:var(--green);color:#fff}
  .st.on:has(+ .st.on)::after{background:var(--green)}
  .note{font-size:14.5px;color:var(--soft);line-height:1.8;margin-top:14px}

  /* --- keep this page ------------------------------------------------- */
  .keep{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--timber);
        border-radius:var(--r);padding:24px;max-width:900px;display:grid;
        grid-template-columns:auto minmax(0,1fr);gap:26px;align-items:start}
  .qrbox{display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center;background:var(--field);
         border:1px solid var(--line);border-radius:12px;padding:16px;font-size:13.5px;color:var(--soft);
         line-height:1.7;max-width:230px}
  .qrbox #qr{line-height:0;background:#fff;padding:8px;border-radius:8px;border:1px solid var(--line)}
  .keepActs{display:flex;flex-direction:column;gap:10px}
  .keepActs #keepLead{font-size:17px;font-weight:600;margin-bottom:4px;line-height:1.6}
  .keep .in{width:100%;border:1px solid var(--line);background:var(--field);border-radius:12px;
            padding:12px;font:inherit;font-size:16px;color:var(--ink)}

  /* --- the foot ------------------------------------------------------- */
  .foot{background:var(--basalt);color:#C3C9BD;font-size:14px;line-height:1.9}
  .foot .wrap{padding-top:22px;padding-bottom:26px;display:flex;flex-wrap:wrap;gap:6px 24px;
              justify-content:space-between;align-items:baseline}
  .foot b{color:var(--ivory)}
  .foot .sig{color:var(--ivory);font-family:'Alexandria',sans-serif;font-size:13.5px;white-space:nowrap}
  .foot .ver{font-family:'Inter',sans-serif;font-size:11px;color:#8E9585;letter-spacing:.04em}

  /* --- a narrower computer, a tablet ----------------------------------- */
  @media (max-width:1180px){
    .medsLayout,.askGrid{grid-template-columns:minmax(0,1fr)}
    .side,.askInfo{position:static}
    .side{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px}
    .askInfo{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));order:-1}
  }
  @media (max-width:900px){
    .pt{--rail:96px}
    .wrap{padding:0 24px}
    .who{grid-template-columns:minmax(0,1fr)}
  }

  /* --- the hand-held case: the wall lies down along the bottom edge,
         where a thumb reaches. Same masonry, same icons, same words. ---- */
  .pt.phone{grid-template-columns:minmax(0,1fr)!important;grid-template-areas:"main"!important;font-size:16.5px}
  .pt.phone .wall{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;
                  padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:60;
                  box-shadow:0 -8px 24px rgba(0,0,0,.18)}
  .pt.phone .dent,.pt.phone .wall .nm{display:none}
  .pt.phone .nav{flex-direction:row;padding:0;gap:2px;flex:1}
  .pt.phone .nv{flex:1;min-width:0;min-height:58px;padding:7px 1px 6px;gap:4px;border-radius:10px}
  .pt.phone .nv[data-nv="lang"]{display:none}
  .pt.phone .nv .ic svg{width:23px;height:23px}
  .pt.phone .nv .tx{font-size:11px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;
                    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .pt.phone.lang-ur .nv .tx{font-size:10.5px;line-height:1.6;-webkit-line-clamp:1}
  .pt.phone .foot .wrap{padding-bottom:calc(26px + 74px + env(safe-area-inset-bottom))}
  .pt.phone .wrap{padding:0 16px}
  .pt.phone .topRow{padding:14px 0 10px}
  .pt.phone .top .bn{font-size:23px}
  .pt.phone .hdrLang{font-size:14px;padding:8px 12px;min-height:44px}
  .pt.phone .forwho{font-size:13.5px;margin-bottom:16px}
  .pt.phone .body{padding:20px 0 30px}
  .pt.phone .who{padding:16px 18px;margin-bottom:20px}
  .pt.phone .who .nm{font-size:21px}
  .pt.phone .med{padding:16px 16px 18px}
  .pt.phone .med .nm{font-size:20px}
  .pt.phone .dose .tx{font-size:17.5px}
  .pt.phone .msg{max-width:90%}
  .pt.phone .keep{grid-template-columns:minmax(0,1fr);padding:18px}
  .pt.phone .qrbox{max-width:none}
  .pt.phone .refill{padding:18px}
  .pt.phone .st{font-size:13px}
  .pt.phone .leafBtn{width:100%;justify-content:center}


  /* --- the patient's own sign-in ---------------------------------------
     The same shape as the staff gate, because it is the same act. The
     national ID selects the record; the code that follows proves the
     person holding the phone is the person on it. Typing the ID alone
     gets nobody in. --- */
  .pgate{position:fixed;inset:0;z-index:200;background:var(--render);
         display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
  .pgate.hidden{display:none}
  .pgWrap{width:100%;max-width:392px;background:var(--card);border:1px solid var(--line);
          border-radius:12px;overflow:hidden;box-shadow:0 22px 54px rgba(34,37,31,.22)}
  .pgTop{background:var(--card);color:var(--ink);padding:18px 20px 17px;position:relative;
         border-bottom:1px solid var(--line)}
  /* Someone who cannot read this screen has exactly one useful action, so
     it sits at the top and never scrolls away. */
  .pgLang{position:absolute;top:12px;inset-inline-end:14px;display:flex;align-items:center;
          gap:7px;background:none;border:1px solid var(--line);color:var(--timber);
          padding:7px 11px;font:inherit;font-size:12.5px;cursor:pointer;border-radius:0;
          min-height:40px}
  .pgLang span{color:var(--ink)}
  .pgTop::after{content:"";position:absolute;left:0;right:0;bottom:0;height:9px;opacity:.5;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='18' height='9'><path d='M9 0.8 L16.5 4.5 L9 8.2 L1.5 4.5 Z' fill='none' stroke='%2396774E' stroke-width='0.9'/><circle cx='9' cy='4.5' r='1.1' fill='%239A7550'/></svg>");
    background-size:18px 9px}
  .pgTop h1{margin:0;font-family:'Alexandria',sans-serif;font-size:26px;color:#2F4A2A}
  .pgTop .t{font-size:13px;color:var(--timber);margin-top:3px}
  .pgBody{padding:18px 20px 20px}
  .pgLead{font-size:14px;color:var(--soft);margin:0 0 14px;line-height:1.7}
  .pgF{margin-bottom:12px}
  .pgF span{display:block;font-size:11.5px;color:#8B8371;margin-bottom:5px}
  .pgF input{width:100%;box-sizing:border-box;border:1px solid var(--line);
             border-top:2px solid #CFC5AC;background:var(--field);padding:13px;
             font:inherit;font-size:17px;border-radius:0;color:var(--ink);letter-spacing:.06em}
  .pgBtn{width:100%;border:none;background:var(--green);color:#fff;padding:15px;
         font:inherit;font-size:16px;font-weight:700;cursor:pointer;border-radius:0;min-height:52px}
  .pgBtn[disabled]{opacity:.6}
  .pgBack{width:100%;border:none;background:none;color:var(--soft);padding:12px;
          font:inherit;font-size:14px;cursor:pointer;margin-top:4px}
  .pgMsg{font-size:13.5px;line-height:1.7;padding:11px 12px;margin-bottom:12px;
         background:#FBF1E8;border:1px solid #E6CBB4;color:#8A3E14}
  .pgSent{background:#EAF0E6;border-color:#CBD9C2;color:#2F4429}
  .pgPin{font-size:26px!important;letter-spacing:.5em;text-align:center}
  .pgKey{font:600 26px/1.2 Inter,system-ui,sans-serif!important;letter-spacing:.18em;text-align:center;text-transform:uppercase}
  .pgF input.pgKey{border-radius:14px;padding:14px 12px;margin-bottom:6px}
  .pgKey::placeholder{color:#C9C2B0;letter-spacing:.18em}
  .pgStep2{display:none}
  .pgate.step2 .pgStep1{display:none}
  .pgate.step2 .pgStep2{display:block}

  /* --- the language sheet ---------------------------------------------
     It covers the page, because choosing a language is the one action
     that must not be missed by someone who cannot read what is behind
     it. Each name is set in its own script and given a target no smaller
     than a fingertip. --- */
  .langSheet{position:fixed;inset:0;z-index:900;background:rgba(28,31,26,.72);
             display:none;align-items:center;justify-content:center;padding:22px}
  .langSheet.on{display:flex}
  .sheetInner{background:var(--card);border:1px solid var(--line);width:100%;max-width:320px;
              box-shadow:0 26px 60px rgba(0,0,0,.4)}
  .lgo{display:block;width:100%;border:none;border-bottom:1px solid var(--line-2);background:none;
       font:inherit;font-size:19px;padding:17px 18px;text-align:start;cursor:pointer;color:var(--ink);
       min-height:60px;border-radius:0}
  .lgo:last-child{border-bottom:none}
  .lgo.on{background:var(--green);color:#FDFBF5;font-weight:700}
  .lgo[lang="ur"]{font-family:'Noto Nastaliq Urdu',serif}
  .lgo[lang="bn"]{font-family:'Noto Sans Bengali',sans-serif}
  .lgo[lang="hi"]{font-family:'Noto Sans Devanagari',sans-serif}
  .lgo[lang="ar"]{font-family:'IBM Plex Sans Arabic',sans-serif}
  .pt{position:relative}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  /* --- dose reminders the patient switches on himself ---------------- */
  .remind{background:var(--card);border:1px solid var(--line);border-inline-start:4px solid var(--green);
          border-radius:var(--r);padding:16px 18px}
  .remind[hidden]{display:none}
  .remind .rh{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16.5px;color:var(--ink)}
  .remind .rh .bell{flex-shrink:0;width:36px;height:36px;border-radius:10px;background:#EEF2E8;color:var(--green);
                    display:grid;place-items:center}
  .remind .rh .bell svg{width:20px;height:20px}
  .remind .rl{font-size:15px;line-height:1.75;margin:10px 0 4px;color:var(--ink)}
  .remind .rp{font-size:13.5px;line-height:1.7;color:var(--soft);margin:0 0 12px}
  .remind .in{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:13px 14px;
              font:inherit;font-size:17px;color:var(--ink);margin-bottom:10px;text-align:left}
  .remind .in:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(78,107,63,.15)}
  .remind .in.bad{border-color:var(--alarm);box-shadow:0 0 0 3px rgba(180,83,31,.12)}
  .remind .rok{display:flex;align-items:flex-start;gap:10px;background:#EEF2E8;border-radius:12px;
               padding:12px 14px;margin:12px 0;font-size:15px;line-height:1.7}
  .remind .rok b{display:block;color:var(--green)}
  .remind .rok .to{unicode-bidi:plaintext}
  .remind .rok svg{flex-shrink:0;margin-top:3px;color:var(--green)}
  .remind .racts{display:flex;gap:8px;flex-wrap:wrap}
  .remind .racts .btn{flex:1 1 140px;min-height:48px;font-size:15.5px;padding:11px 14px}
  .remind .rmsg{font-size:14.5px;line-height:1.7;margin-top:10px;color:var(--soft)}
  .remind .rmsg.err{color:var(--alarm)}
  .remind .rmsg:empty{display:none}
</style>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600;700;800&display=swap" rel="stylesheet">
<style id="ph7-theme">
/* ph7: approved Adwiyati identity. Colour tokens and brand marks only. */
:root{--basalt:#2F4A2A;--basalt-d:#24391F;--pointing:#4E6B3F;--render:#FBF8F1;--card:#FFFFFF;--field:#FBF8F1;
 --timber:#E08A1E;--timber-d:#B4531F;--ivory:#F4EBDA;--gold:#B4531F;--green:#4E6B3F;--cement:#7A8270;--alarm:#B4531F;
 --line:#E7E2D6;--line-2:#EFEBE1;--ink:#1C2B1A;--soft:#5A6553}
.top::after,.pgTop::after,.wall::before,.poster::before{display:none!important}
.wall .dent{display:none!important}
.pgTop h1,.top .bn,.wall .nm{font-family:'Alexandria',sans-serif!important;letter-spacing:-.01em}
.pgSeal{display:block;margin-bottom:8px}
.pgTop .t{color:#B4531F!important}
.pgBtn{background:#2F4A2A!important;border-radius:999px!important}
.pgBtn:hover{background:#3C5D36!important}
.pgF input:focus{outline:2px solid #E08A1E;outline-offset:1px}
/* ph7.4: rounded, like every other surface of the identity */
.pgWrap{border-radius:22px!important;overflow:hidden}
.pgLang{border-radius:999px!important;border-color:#E1DACB!important}
.pgF input{border-radius:14px!important}
</style>
</head>
<body>

<div class="pgate hidden" id="pgate">
  <div class="pgWrap">
    <div class="pgTop">
      <button type="button" class="pgLang" id="pgLang" aria-label="Language">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.9" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="8.6"/><path d="M3.4 12h17.2"/>
          <path d="M12 3.4c2.4 2.6 2.4 14.6 0 17.2M12 3.4c-2.4 2.6-2.4 14.6 0 17.2"/>
        </svg><span id="pgLangNow">العربية</span>
      </button>
      <svg class="pgSeal" width="52" height="52" viewBox="0 0 120 120" aria-hidden="true"><defs><path id="arcpg" d="M60 60 m-43 0 a43 43 0 1 1 86 0 a43 43 0 1 1 -86 0"/></defs><circle cx="60" cy="60" r="56" fill="#2F4A2A"/><circle cx="60" cy="60" r="34" fill="none" stroke="#FFFFFF" stroke-opacity=".35" stroke-width="1"/><text direction="ltr" style="direction:ltr;unicode-bidi:normal" font-family="Inter, sans-serif" font-weight="600" font-size="10.5" letter-spacing="2.2" fill="#FFFFFF"><textPath href="#arcpg" startOffset="0" textLength="262" lengthAdjust="spacing">ADWIYATI · PHARMACY LABELS ·</textPath></text><g transform="rotate(-45 60 60)"><rect x="38" y="49" width="44" height="22" rx="11" fill="#FFFFFF"/><path d="M60 49 h11 a11 11 0 0 1 0 22 h-11z" fill="#E08A1E"/></g></svg>
      <h1>أدويتي</h1>
      <div class="t" id="pgTag">افهم دواءك</div>
    </div>
    <div class="pgBody">
      <div id="pgMsg"></div>

      <div class="pgStep1">
        <p class="pgLead" id="pgLead1">اكتب الكود المطبوع على كيس دوائك.</p>
        <label class="pgF"><span id="pgIdLbl">الكود المطبوع على الكيس</span>
          <input type="text" id="pgId" inputmode="numeric" maxlength="9" dir="ltr" class="pgKey" placeholder="12345"
                 name="adwiyati-patient-id" autocomplete="off"
                 autocorrect="off" autocapitalize="off" spellcheck="false"
                 data-lpignore="true" data-1p-ignore="true" data-form-type="other"></label>
        <label class="pgF" hidden style="display:none"><span id="pgPinLbl">الرمز — أربعة أرقام</span>
          <input type="text" id="pgPin" inputmode="numeric" maxlength="4" dir="ltr" class="pgPin"
                 name="adwiyati-bag-code" autocomplete="off"
                 autocorrect="off" autocapitalize="off" spellcheck="false"
                 data-lpignore="true" data-1p-ignore="true" data-form-type="other"></label>
        <button class="pgBtn" id="pgGo">دخول</button>
        <button class="pgBack" id="pgLost" hidden style="display:none">فقدت الكيس؟ أرسل رمزاً إلى بريدي</button>
        <button class="pgBack" id="pgHome">رجوع</button>
      </div>

      <div class="pgStep2">
        <p class="pgLead" id="pgLead2"></p>
        <label class="pgF"><span id="pgCodeLbl">رمز الدخول</span>
          <input type="text" id="pgCode" inputmode="numeric" maxlength="6" autocomplete="one-time-code" dir="ltr"></label>
        <button class="pgBtn" id="pgVerify">دخول</button>
        <button class="pgBack" id="pgAgain">رقم آخر</button>
      </div>
    </div>
  </div>
</div>

<div class="outer">
  <div class="frame">
    <div class="pt" id="pt" dir="rtl">

      <div class="langSheet" id="langSheet"><div class="sheetInner"></div></div>

      <nav class="wall" id="wall" aria-label="أقسام">
        <div class="dent"><i></i><i></i><i></i><i></i><i></i></div>
        <div class="nm">أدويتي</div>
        <div class="nav" id="nav"></div>
      </nav>

      <div class="main">
        <header class="top">
          <div class="wrap">
            <div class="topRow">
              <div>
                <div class="bn">أدويتي</div>
                <div class="tag" id="tagline"></div>
              </div>
              <button type="button" class="hdrLang" id="hdrLang" aria-haspopup="dialog">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.4"/><path d="M3.6 12h16.8"/><path d="M12 3.6c2.5 2.7 2.5 14.1 0 16.8M12 3.6c-2.5 2.7-2.5 14.1 0 16.8"/></svg>
                <span id="hdrLangNow">العربية</span>
              </button>
            </div>
            <div class="forwho"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V7.8a4 4 0 0 1 8 0v2.7"/></svg><span id="forwho"></span></div>
          </div>
        </header>

           'জন্মনিয়ন্ত্রণ বড়ির কার্যকারিতা কমাতে পারে।'], hi:["इससे हल्के दस्त हो सकते हैं। अगर दस्त तेज़ हों या उनमें ख़ून हो, तो फार्मासिस्ट को बताएँ।","अगर आपको पेनिसिलिन से एलर्जी है, तो अपने डॉक्टर को बताएँ।","यह गर्भनिरोधक गोलियों का असर कम कर सकती है।"], tl:["Maaari itong magdulot ng bahagyang pagtatae. Sabihin sa parmasyutiko kung matindi ito o may dugo.","Sabihin sa iyong doktor kung may allergy ka sa penicillin.","Maaari nitong pahinain ang bisa ng mga pills na pampigil sa pagbubuntis."],
       id:['Dapat menyebabkan diare ringan. Beri tahu apoteker bila berat atau berdarah.',
           'Beri tahu dokter bila Anda alergi penisilin.',
           'Dapat mengurangi efektivitas pil KB.'], ms:["Ia boleh menyebabkan cirit-birit ringan. Beritahu ahli farmasi jika cirit-birit teruk atau berdarah.","Beritahu doktor anda jika anda alah kepada penisilin.","Ia boleh mengurangkan keberkesanan pil perancang kehamilan."],
       es:['Puede causar diarrea leve. Avise al farmacéutico si es intensa o con sangre.',

  imp:{ar:['اشطف فمك بالماء بعد كل استخدام.',

       en:['Rinse your mouth with water after each use.',
           'If you need it more than twice a week, see your doctor — your treatment needs review.',
           'You may feel a slight tremor or fast heartbeat; it passes in minutes.'],
       ur:['ہر استعمال کے بعد منہ پانی سے دھو لیں۔',
           'ہفتے میں دو بار سے زیادہ ضرورت پڑے تو ڈاکٹر سے رجوع کریں۔',
           'ہلکی کپکپاہٹ یا دل کی تیز دھڑکن ہو سکتی ہے؛ چند منٹ میں ختم ہو جاتی ہے۔'],
       bn:['প্রতিবার ব্যবহারের পর মুখ পানি দিয়ে ধুয়ে ফেলুন।',
           'সপ্তাহে দুইবারের বেশি লাগলে ডাক্তার দেখান।',
           'সামান্য কাঁপুনি বা দ্রুত হৃদস্পন্দন হতে পারে; কয়েক মিনিটে চলে যায়।'], hi:["हर बार इस्तेमाल के बाद मुँह पानी से धो लें।","अगर हफ़्ते में दो बार से ज़्यादा इसकी ज़रूरत पड़े, तो डॉक्टर को दिखाएँ — आपके इलाज की दोबारा जाँच ज़रूरी है।","आपको हल्की कँपकँपी या तेज़ धड़कन महसूस हो सकती है; यह कुछ मिनटों में ठीक हो जाती है।"], tl:["Magmumog ng tubig pagkatapos ng bawat paggamit.","Kung kailangan mo ito nang higit sa dalawang beses sa isang linggo, magpatingin sa doktor — kailangang suriin ang iyong gamutan.","Maaari kang makaramdam ng bahagyang panginginig o mabilis na tibok ng puso; nawawala ito sa loob ng ilang minuto."],
       id:['Kumur dengan air setiap selesai memakai.',
           'Bila perlu lebih dari dua kali seminggu, temui dokter Anda.',
           'Mungkin terasa gemetar ringan atau jantung berdebar; hilang dalam beberapa menit.'], ms:["Kumur mulut dengan air selepas setiap kali guna.","Jika anda memerlukannya lebih daripada dua kali seminggu, jumpa doktor — rawatan anda perlu disemak semula.","Anda mungkin berasa sedikit menggeletar atau jantung berdebar laju; ia akan hilang dalam beberapa minit."],

  steps:{ar:['رجّ البخاخ خمس مرات.','أخرج الزفير بعيداً عن البخاخ.','أطبق شفتيك على الفوهة.','اضغط واستنشق ببطء في آن واحد.','احبس نفسك عشر ثوانٍ.','اشطف فمك بالماء.'],

         ur:['انہیلر کو پانچ بار ہلائیں۔','انہیلر سے ہٹ کر سانس باہر نکالیں۔','ماؤتھ پیس پر ہونٹ بند کریں۔','دباتے ہی آہستہ سانس اندر لیں۔','دس سیکنڈ سانس روکیں۔','منہ پانی سے دھو لیں۔'],
         bn:['ইনহেলারটি পাঁচবার ঝাঁকান।','ইনহেলার থেকে মুখ সরিয়ে শ্বাস ছাড়ুন।','মাউথপিসে ঠোঁট চেপে ধরুন।','চাপ দেওয়ার সঙ্গে সঙ্গে ধীরে শ্বাস নিন।','দশ সেকেন্ড শ্বাস ধরে রাখুন।','মুখ পানি দিয়ে ধুয়ে ফেলুন।'], hi:["इनहेलर को पाँच बार हिलाएँ।","इनहेलर से दूर मुँह करके साँस बाहर छोड़ें।","माउथपीस को होंठों से कसकर पकड़ें।","दबाएँ और उसी समय धीरे-धीरे साँस अंदर लें।","दस सेकंड तक साँस रोकें।","मुँह पानी से धो लें।"], tl:["Alugin ang inhaler nang limang beses.","Huminga palabas, malayo sa inhaler.","Isara ang iyong mga labi sa mouthpiece.","Pindutin at dahan-dahang huminga papasok nang sabay.","Pigilin ang hininga nang sampung segundo.","Magmumog ng tubig."],
         id:['Kocok inhaler lima kali.','Buang napas menjauh dari inhaler.','Rapatkan bibir pada corongnya.','Tekan sambil menarik napas perlahan.','Tahan napas sepuluh detik.','Kumur dengan air.'], ms:["Goncang inhaler lima kali.","Hembus nafas, jauh daripada inhaler.","Katupkan bibir di sekeliling corong mulut.","Tekan dan tarik nafas perlahan-lahan pada masa yang sama.","Tahan nafas selama sepuluh saat.","Kumur mulut dengan air."],
         es:['Agite el inhalador cinco veces.','Espire lejos del inhalador.','Cierre los labios sobre la boquilla.','Presione e inspire despacio a la vez.','Aguante la respiración diez segundos.','Enjuáguese la boca con agua.'],fr:["Agitez l'inhalateur cinq fois.", "Expirez, loin de l'inhalateur.", "Fermez les lèvres autour de l'embout.", "Appuyez et inspirez lentement en même temps.", "Retenez votre respiration dix secondes.", "Rincez-vous la bouche à l'eau."],tr:["İnhaleri beş kez çalkalayın.", "İnhalerden uzağa doğru nefes verin.", "Dudaklarınızı ağızlığın etrafına kapatın.", "Bastırırken aynı anda yavaşça nefes alın.", "Nefesinizi on saniye tutun.", "Ağzınızı suyla çalkalayın."],de:["Schütteln Sie den Inhalator fünfmal.", "Atmen Sie vom Inhalator weg aus.", "Umschließen Sie das Mundstück mit den Lippen.", "Drücken und gleichzeitig langsam einatmen.", "Halten Sie zehn Sekunden die Luft an.", "Spülen Sie den Mund mit Wasser aus."],ja:["吸入器を5回振ります。", "吸入器から顔をそらして息を吐きます。", "吸い口を唇でしっかりくわえます。", "押すと同時にゆっくり息を吸います。", "10秒間息を止めます。", "水で口をすすぎます。"],ru:["Встряхните ингалятор пять раз.", "Выдохните в сторону от ингалятора.", "Плотно обхватите мундштук губами.", "Нажмите и одновременно медленно вдохните.", "Задержите дыхание на десять секунд.", "Прополощите рот водой."],zh:["将吸入器摇晃五次。", "背对吸入器呼气。", "用嘴唇含紧吸嘴。", "按压的同时缓慢吸气。", "屏住呼吸十秒钟。", "用清水漱口。"]}},
 /* ph6.50: the insulin-pen film (Arabic narration, subtitles burned in per language).
    Only the languages that have a film and reviewed-draft steps carry the entry; the

 insulinPen:{"t": {"ar": "طريقة الحقن بقلم الإنسولين", "en": "How to inject with an insulin pen", "ur": "انسولین پین سے انجکشن لگانے کا طریقہ", "id": "Cara menyuntik dengan pena insulin", "ms":"Cara menyuntik dengan pen insulin", "bn": "ইনসুলিন পেন দিয়ে ইনজেকশন দেওয়ার নিয়ম", "hi":"इंसुलिन पेन से इंजेक्शन लगाने का तरीका", "tl":"Paano mag-iniksiyon gamit ang insulin pen", "tr": "İnsülin kalemiyle enjeksiyon nasıl yapılır"}, "steps": {"ar": ["اغسل يديك جيدًا بالماء والصابون. تحقّق من نوع الإنسولين وتاريخ صلاحيته.", "قم بتثبيت إبرة جديدة. انزع الغطاء الخارجي والغطاء الداخلي.", "اختبر سلامة التدفق: اضبط القلم على وحدتين (2)، ووجّه الإبرة إلى الأعلى. اضغط على الزر حتى تظهر قطرة من الإنسولين (لضمان طرد الهواء والتأكد من كفاءة الإبرة).", "أماكن الحقن: البطن، الفخذ، الأرداف، الذراع من الخلف. احرص دائمًا على تغيير موضع الحقن في كل مرة بالابتعاد مسافة 2 إلى 3 سم عن آخر نقطة، مع تجنّب المناطق التي تحتوي على كتل أو كدمات أو جروح.", "إذا استخدمت المسحة الكحولية، انتظر حتى يجفّ الجلد تمامًا.", "أدخل الإبرة بزاوية 90°. اضغط على زر الحقن بالكامل ببطء، وانتظر لمدة 10 ثوانٍ قبل سحب الإبرة لضمان اكتمال الجرعة. ملاحظة: الإبر القصيرة بطول 4 ملم لا تتطلب ثني الجلد.", "عقب الانتهاء، انزع الإبرة بهدوء وتخلّص منها في مكان آمن.", "أخطاء شائعة يجب تجنّبها: إعادة استخدام الإبرة، الحقن في نفس المكان دائمًا، ترك الإبرة مثبّتة على القلم، مشاركة القلم مع أي شخص."], "en": ["Wash your hands well with soap and water. Check the type of insulin and its expiry date.", "Attach a new needle. Remove the outer cap and the inner cap.", "Do a safety test: set the pen to 2 units and point the needle upward. Press the button until a drop of insulin appears. This pushes out the air and shows the needle works.", "Where to inject: the abdomen, the thigh, the buttocks, the back of the upper arm. Change the injection spot every time, 2 to 3 cm away from the last one, and avoid areas with lumps, bruises or wounds.", "If you use an alcohol swab, wait until the skin is completely dry.", "Insert the needle at a 90° angle. Press the injection button all the way down, slowly, and wait 10 seconds before pulling out the needle, so the full dose goes in. Note: short 4 mm needles do not need a skin pinch.", "When you finish, remove the needle gently and throw it away in a safe place.", "Common mistakes to avoid: reusing the needle, always injecting in the same spot, leaving the needle on the pen, sharing the pen with anyone."], "ur": ["اپنے ہاتھ صابن اور پانی سے اچھی طرح دھوئیں۔ انسولین کی قسم اور اس کی میعاد ختم ہونے کی تاریخ چیک کریں۔", "نئی سوئی لگائیں۔ باہر والا ڈھکن اور اندر والا ڈھکن اتار دیں۔", "حفاظتی جانچ کریں: پین کو 2 یونٹ پر سیٹ کریں اور سوئی کا رخ اوپر کی طرف رکھیں۔ بٹن دبائیں یہاں تک کہ انسولین کا ایک قطرہ نظر آئے۔ اس سے ہوا نکل جاتی ہے اور پتا چلتا ہے کہ سوئی ٹھیک کام کر رہی ہے۔", "انجکشن لگانے کی جگہیں: پیٹ، ران، کولہے، بازو کا پچھلا حصہ۔ ہر بار انجکشن کی جگہ بدلیں، پچھلی جگہ سے 2 سے 3 سینٹی میٹر دور، اور ان جگہوں سے بچیں جہاں گانٹھ، نیل یا زخم ہو۔", "اگر الکحل والی روئی (سواب) استعمال کریں تو جلد کے پوری طرح خشک ہونے تک انتظار کریں۔", "سوئی کو 90° کے زاویے پر جلد میں داخل کریں۔ انجکشن کا بٹن آہستہ آہستہ پورا دبائیں، اور سوئی نکالنے سے پہلے 10 سیکنڈ انتظار کریں تاکہ پوری خوراک اندر چلی جائے۔ نوٹ: 4 ملی میٹر کی چھوٹی سوئیوں کے لیے جلد کو چٹکی میں پکڑنے کی ضرورت نہیں۔", "انجکشن کے بعد سوئی آرام سے اتاریں اور اسے کسی محفوظ جگہ پھینکیں۔", "عام غلطیاں جن سے بچنا ہے: سوئی دوبارہ استعمال کرنا، ہمیشہ ایک ہی جگہ انجکشن لگانا، سوئی کو پین پر لگا ہوا چھوڑ دینا، پین کسی اور کے ساتھ شیئر کرنا۔"], "id": ["Cuci tangan Anda dengan sabun dan air sampai bersih. Periksa jenis insulin dan tanggal kedaluwarsanya.", "Pasang jarum yang baru. Lepaskan tutup luar dan tutup dalam jarum.", "Lakukan uji keamanan: atur pena ke 2 unit dan arahkan jarum ke atas. Tekan tombol sampai keluar setetes insulin. Ini mengeluarkan udara dan memastikan jarum berfungsi baik.", "Tempat suntikan: perut, paha, bokong, lengan atas bagian belakang. Selalu ganti tempat suntikan setiap kali, berjarak 2–3 cm dari titik terakhir, dan hindari area yang ada benjolan, memar, atau luka.", "Jika memakai kapas alkohol, tunggu sampai kulit benar-benar kering.", "Tusukkan jarum dengan sudut 90° (tegak lurus). Tekan tombol suntik sampai habis secara perlahan, lalu tunggu 10 detik sebelum mencabut jarum agar seluruh dosis masuk. Catatan: dengan jarum pendek 4 mm, kulit tidak perlu dicubit.", "Setelah selesai, lepaskan jarum dengan hati-hati dan buang di tempat yang aman.", "Kesalahan umum yang harus dihindari: memakai ulang jarum, selalu menyuntik di tempat yang sama, membiarkan jarum terpasang di pena, memakai pena bersama orang lain."], "ms":["Basuh tangan anda dengan baik menggunakan sabun dan air. Periksa jenis insulin dan tarikh luputnya.","Pasang jarum baharu. Tanggalkan penutup luar dan penutup dalam.","Lakukan ujian keselamatan: tetapkan pen pada 2 unit dan halakan jarum ke atas. Tekan butang sehingga setitis insulin keluar. Ini menolak keluar udara dan menunjukkan jarum berfungsi.","Tempat suntikan: perut, peha, punggung, bahagian belakang lengan atas. Tukar tempat suntikan setiap kali, 2 hingga 3 cm dari tempat yang terakhir, dan elakkan kawasan yang mempunyai ketulan, lebam atau luka.","Jika anda menggunakan kapas alkohol, tunggu sehingga kulit benar-benar kering.","Cucuk jarum pada sudut 90°. Tekan butang suntikan perlahan-lahan hingga habis, dan tunggu 10 saat sebelum menarik keluar jarum, supaya dos penuh masuk. Nota: jarum pendek 4 mm tidak memerlukan kulit dicubit.","Apabila selesai, tanggalkan jarum perlahan-lahan dan buang di tempat yang selamat.","Kesilapan biasa yang perlu dielakkan: menggunakan semula jarum, sentiasa menyuntik di tempat yang sama, membiarkan jarum pada pen, berkongsi pen dengan orang lain."], "bn": ["সাবান ও পানি দিয়ে হাত ভালো করে ধুয়ে নিন। ইনসুলিনের ধরন ও মেয়াদ শেষের তারিখ দেখে নিন।", "একটি নতুন সুই লাগান। বাইরের ঢাকনা ও ভেতরের ঢাকনা খুলে ফেলুন।", "নিরাপত্তা পরীক্ষা করুন: পেনটি ২ ইউনিটে সেট করুন এবং সুইয়ের মুখ উপরের দিকে রাখুন। এক ফোঁটা ইনসুলিন দেখা না যাওয়া পর্যন্ত বোতাম চাপুন। এতে বাতাস বের হয়ে যায় এবং বোঝা যায় সুই ঠিকমতো কাজ করছে।", "ইনজেকশন দেওয়ার জায়গা: পেট, উরু, নিতম্ব, বাহুর পেছনের অংশ। প্রতিবার ইনজেকশনের জায়গা বদলান — আগের জায়গা থেকে ২–৩ সেমি দূরে, এবং যেখানে গুটি, কালশিটে বা ক্ষত আছে সেখানে দেবেন না।", "অ্যালকোহল সোয়াব ব্যবহার করলে ত্বক পুরোপুরি শুকানো পর্যন্ত অপেক্ষা করুন।", "সুইটি ৯০° কোণে ঢোকান। ইনজেকশনের বোতামটি ধীরে ধীরে পুরোটা চাপুন, এবং সুই বের করার আগে ১০ সেকেন্ড অপেক্ষা করুন, যাতে পুরো ডোজ ঢোকে। নোট: ৪ মিমি ছোট সুইয়ের জন্য ত্বক চিমটি দিয়ে ধরার দরকার নেই।", "শেষ হলে আস্তে করে সুইটি খুলে নিরাপদ জায়গায় ফেলে দিন।", "যে সাধারণ ভুলগুলো এড়িয়ে চলবেন: সুই আবার ব্যবহার করা, সবসময় একই জায়গায় ইনজেকশন দেওয়া, সুই পেনে লাগিয়ে রেখে দেওয়া, অন্য কারও সঙ্গে পেন শেয়ার করা।"], "hi":["अपने हाथ साबुन और पानी से अच्छी तरह धोएँ। इंसुलिन का प्रकार और उसकी एक्सपायरी तारीख जाँच लें।","नई सुई लगाएँ। बाहर का ढक्कन और अंदर का ढक्कन हटा दें।","सुरक्षा जाँच करें: पेन को 2 यूनिट पर सेट करें और सुई ऊपर की ओर रखें। बटन तब तक दबाएँ जब तक इंसुलिन की एक बूँद दिखाई न दे। इससे हवा निकल जाती है और पता चलता है कि सुई ठीक काम कर रही है।","इंजेक्शन लगाने की जगहें: पेट, जाँघ, नितंब, बाँह का पिछला हिस्सा। हर बार इंजेक्शन की जगह बदलें — पिछली जगह से 2–3 सेमी दूर, और उन जगहों से बचें जहाँ गाँठ, नील या घाव हो।","अगर आप अल्कोहल स्वैब (रुई) इस्तेमाल करते हैं, तो त्वचा के पूरी तरह सूखने तक इंतज़ार करें।","सुई को 90° के कोण पर अंदर डालें। इंजेक्शन का बटन धीरे-धीरे पूरा दबाएँ, और सुई निकालने से पहले 10 सेकंड रुकें, ताकि पूरी खुराक अंदर जाए। नोट: 4 मिमी की छोटी सुइयों के लिए त्वचा को चुटकी से पकड़ने की ज़रूरत नहीं है।","इंजेक्शन के बाद सुई को आराम से निकालें और किसी सुरक्षित जगह फेंकें।","आम गलतियाँ जिनसे बचना है: सुई दोबारा इस्तेमाल करना, हमेशा एक ही जगह इंजेक्शन लगाना, सुई को पेन पर लगा हुआ छोड़ देना, पेन किसी और के साथ साझा करना।"], "tl":["Hugasang mabuti ang iyong mga kamay gamit ang sabon at tubig. Tingnan ang uri ng insulin at ang petsa ng pag-expire nito.","Magkabit ng bagong karayom. Tanggalin ang panlabas na takip at ang panloob na takip.","Gumawa ng safety test: itakda ang pen sa 2 units at ituro paitaas ang karayom. Pindutin ang button hanggang lumabas ang isang patak ng insulin. Lalabas ang hangin at makikitang gumagana ang karayom.","Saan mag-iniksiyon: sa tiyan, hita, puwit, likod ng itaas na braso. Palitan ang lugar ng iniksiyon tuwing gagamit, 2 hanggang 3 cm ang layo mula sa huli, at iwasan ang mga bahaging may bukol, pasa o sugat.","Kung gumamit ka ng alcohol swab, hintaying matuyo nang lubusan ang balat.","Itusok ang karayom nang 90° ang anggulo. Pindutin nang dahan-dahan ang button hanggang dulo. Maghintay ng 10 segundo bago hugutin ang karayom para buo ang dosis. Paalala: hindi kailangang kurutin ang balat kapag maikli ang karayom na 4 mm.","Pagkatapos, tanggalin nang marahan ang karayom at itapon ito sa ligtas na lugar.","Mga karaniwang pagkakamaling dapat iwasan: paggamit ulit ng karayom, laging pag-iniksiyon sa iisang lugar, pag-iwan ng karayom na nakakabit sa pen, pagpapahiram ng pen sa iba."], "tr": ["Ellerinizi sabun ve suyla iyice yıkayın. İnsülinin türünü ve son kullanma tarihini kontrol edin.", "Yeni bir iğne takın. Dış kapağı ve iç kapağı çıkarın.", "Güvenlik testi yapın: kalemi 2 üniteye ayarlayın ve iğneyi yukarı doğru tutun. Bir damla insülin görünene kadar düğmeye basın. Bu, havayı çıkarır ve iğnenin çalıştığını gösterir.", "Enjeksiyon bölgeleri: karın, uyluk, kalça, kolun arka kısmı. Enjeksiyon yerini her seferinde değiştirin; bir önceki noktadan 2–3 cm uzak olsun, ve şişlik, morluk veya yara olan bölgelerden kaçının.", "Alkollü pamuk kullanırsanız cildin tamamen kurumasını bekleyin.", "İğneyi 90° açıyla batırın. Enjeksiyon düğmesine yavaşça sonuna kadar basın ve dozun tamamının girmesi için iğneyi çıkarmadan önce 10 saniye bekleyin. Not: 4 mm'lik kısa iğnelerde cildi sıkıştırmaya gerek yoktur.", "İşiniz bitince iğneyi dikkatlice çıkarın ve güvenli bir yere atın.", "Kaçınılması gereken yaygın hatalar: iğneyi tekrar kullanmak, hep aynı yere enjeksiyon yapmak, iğneyi kalemin üzerinde bırakmak, kalemi başkasıyla paylaşmak."]}, "film": {"sign": {"ar": "films/insulin-pen-ar-sign.mp4"}, "signPoster": {"ar": "films/insulin-pen-ar-sign.jpg"}, "ui": {"ar": {"read": "إن لم يعمل المقطع: اقرأ الخطوات مكتوبة", "hide": "إخفاء الخطوات المكتوبة", "full": "ملء الشاشة", "close": "إغلاق"}, "en": {"read": "Film not playing? Read the written steps", "hide": "Hide the written steps", "full": "Full screen", "close": "Close"}, "ur": {"read": "ویڈیو نہ چلے؟ لکھے ہوئے مراحل پڑھیں", "hide": "لکھے ہوئے مراحل چھپائیں", "full": "پوری اسکرین", "close": "بند کریں"}, "id": {"read": "Video tidak bisa diputar? Baca langkah tertulis", "hide": "Sembunyikan langkah tertulis", "full": "Layar penuh", "close": "Tutup"}, "ms":{"read":"Filem tidak dapat dimainkan? Baca langkah bertulis","hide":"Sembunyikan langkah bertulis","full":"Skrin penuh","close":"Tutup"}, "bn": {"read": "ভিডিও চলছে না? লেখা ধাপগুলো পড়ুন", "hide": "লেখা ধাপগুলো লুকান", "full": "পূর্ণ স্ক্রিন", "close": "বন্ধ করুন"}, "hi":{"read":"वीडियो नहीं चल रहा? लिखे हुए चरण पढ़ें","hide":"लिखे हुए चरण छिपाएँ","full":"पूरी स्क्रीन","close":"बंद करें"}, "tl":{"read":"Ayaw mag-play ng video? Basahin ang mga nakasulat na hakbang","hide":"Itago ang mga nakasulat na hakbang","full":"Buong screen","close":"Isara"}, "tr": {"read": "Video açılmıyor mu? Yazılı adımları okuyun", "hide": "Yazılı adımları gizleyin", "full": "Tam ekran", "close": "Kapat"}}, "signLbl": {"ar": ["لغة الإشارة", "إيقاف لغة الإشارة"], "en": ["Sign language", "Hide sign language"]}, "dur": "2:00", "src": {"ar": "films/insulin-pen-ar.mp4", "en": "films/insulin-pen-en.mp4", "ur": "films/insulin-pen-ur.mp4", "id": "films/insulin-pen-id.mp4", "ms":"films/insulin-pen-ms.mp4", "bn": "films/insulin-pen-bn.mp4", "hi":"films/insulin-pen-hi.mp4", "tl":"films/insulin-pen-tl.mp4", "tr": "films/insulin-pen-tr.mp4"}, "poster": {"ar": "films/insulin-pen-ar.jpg", "en": "films/insulin-pen-en.jpg", "ur": "films/insulin-pen-ur.jpg", "id": "films/    The page opens with the code from the link and asks the database for
   this person's prescriptions. Three things are worth stating plainly:

     — the anon key below identifies the project, not a person. On its
       own it reads nothing: every table is closed to it, and the only

       from the link.

       stored on the order at dispense. Nothing is re-derived here, so

     — finished courses come back as names and dates only. The barcode
       now opens a history, and a bag left in a bin should not hand over

const SB_URL  = 'https://eupjgrhairixgmjwftnq.supabase.co';
const SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1cGpncmhhaXJpeGdtandmdG5xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2Mjk1ODcsImV4cCI6MjEwMjIwNTU4N30.cv1nciUDlVFbuOTRecwHkgIodHgP5iZE8UnsPEW5ROI';

const RX_CODE = new URLSearchParams(location.search).get('rx') || '';
let LIVE = null;          // null until the first answer comes back

async function rpc(fn, body){
  const res = await fetch(SB_URL + '/rest/v1/rpc/' + fn, {
    method:'POST',
    headers:{ 'apikey':SB_ANON, 'Authorization':'Bearer '+SB_ANON,
              'Content-Type':'application/json' },
    body: JSON.stringify(body||{})
  });
  if(!res.ok){
    /* Carry the status code, not just the body. A 404 here means the API
       layer cannot see the function — its schema cache is stale — and that
       looks identical on screen to a wrong PIN unless the code is kept.
       Diagnosing this by guesswork cost hours; it should announce itself. */
    const text = await res.text();
    const err = new Error(text || ('HTTP ' + res.status));
    err.status = res.status;
    throw err;
  }
  return res.json();
}

async function loadLive(){
  if(!RX_CODE || RX_CODE.length < 20) return;   // demo link, or none
  try{
    const rows = await rpc('get_prescription', { p_code: RX_CODE });
    if(Array.isArray(rows) && rows.length) LIVE = rows;
  }catch(e){
    /* A failed read must not leave a blank page: the sample content stays
       on screen and the person can still reach the pharmacist. */
    console.warn('Could not load this prescription:', e);
  }
  render();
}

            (v.purpose?'<p class="look" dir="auto">'+v.purpose+'</p>':'')+
            '<div class="dose"><span class="ic">'+ICONS.count+'</span><div class="tx" dir="auto">'+v.how+'</div></div>'+
            missed+listen+warns+leaf+'</article>';
        }).join('');
      }).join('') : '<div class="med empty"><div class="eIc">'+ICONS.rx+'</div><p class="eT">'+t2.noActive+'</p>'+
          '<div class="eAct">'+['ask','refill'].map(function(k){ return '<button type="button" class="eBtn" data-go="'+k+'">'+NAVICON[k]+'<span>'+t2.nav[k]+'</span></button>'; }).join('')+'</div></div>')
      +
      (past.length
        ? '<h2 class="sec" style="margin-top:22px"><span class="mk"><i></i></span><span>'+
          t2.pastT+'</span></h2>'+
          '<div class="pastList">'+past.map(function(r){
            const loc=(T[lang]&&T[lang].dir==='rtl'&&lang==='ar')?'ar-SA-u-nu-latn':undefined;
            const when=new Date(r.dispensed_at).toLocaleDateString(loc,
              {year:'numeric',month:'short',day:'numeric'});
            /* the saved name list can be empty on older orders; the names on
               the saved label are the same medicines, so they are used next */
            let names=(Array.isArray(r.names)?r.names:[]).filter(Boolean);
            if(!names.length) names=(Array.isArray(r.view)?r.view:[]).map(function(v){ return v && v.name; }).filter(Boolean);
            return '<div class="pastRow"><span class="pIc">'+ICONS.rx+'</span>'+
              '<div class="pN">'+(names.length?'<bdi>'+esc(names.join(' · '))+'</bdi>':'<span style="color:var(--soft)">'+when+'</span>')+'</div>'+
              (names.length?'<div class="pD">'+when+'</div>':'')+'</div>';
          }).join('')+'</div>'
        : '');

    /* the how-to films still key off dosage form; with live data we do not
       yet know the form reliably, so the section keeps its full library */
    document.querySelectorAll('.view').forEach(v=>
      v.classList.toggle('on', v.dataset.v===(view==='lang'?'meds':view)));
    return;
  }

  /* No prescription loaded: say so, rather than showing someone else's. */
  document.getElementById('meds').innerHTML =
    '<div class="med empty"><p class="look">'+t.needCode+'</p></div>';
  document.getElementById('warnList').innerHTML='';

  document.querySelectorAll('.view').forEach(v=>
    v.classList.toggle('on', v.dataset.v===(view==='lang'?'meds':view)));
}

/* The language control opens a list. Cycling through six languages one
   tap at a time is unusable for the person it exists to serve — someone
   looking at a page they cannot read. Each language is written in its
   own script, because that is the only word on the sheet they can find. */
function openLangSheet(){
  const sheet=document.getElementById('langSheet');
  sheet.innerHTML='<div class="sheetInner">'+
    Object.keys(T).map(k=>'<button class="lgo'+(k===lang?' on':'')+'" data-l="'+k+'" lang="'+k+'">'+
      T[k].name+'</button>').join('')+'</div>';
  sheet.classList.add('on');
}
function closeLangSheet(){ document.getElementById('langSheet').classList.remove('on'); }

document.getElementById('nav').addEventListener('click',e=>{
  const b=e.target.closest('.nv'); if(!b) return;
  const k=b.dataset.nv;
  if(k==='lang'){ openLangSheet(); return; }
  view=k; render(); window.scrollTo({top:0,behavior:'smooth'});
});
document.getElementById('hdrLang').addEventListener('click', openLangSheet);
document.getElementById('langSheet').addEventListener('click',e=>{
  /* Two screens share this one sheet: the page itself (data-l) and the
     sign-in gate (data-gl). Matching on `.lgo` alone meant this handler
     also caught the gate's buttons, read a data-l that was not there, and
     set the language to undefined — which is what blanked the page. Each
     handler now answers only for its own buttons. */
  const b=e.target.closest('.lgo[data-l]');
  if(b){
    lang=b.dataset.l;
    try{ localStorage.setItem('adwiyati.lang', lang); }catch(e){}
    closeLangSheet(); render(); return;
  }
  if(e.target.id==='langSheet') closeLangSheet();
});
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]'); if(!g) return;
  view=g.dataset.go; render(); window.scrollTo({top:0,behavior:'smooth'});
});
/* the wall stands beside the page on a desktop and lies along the bottom
   edge on a phone: the same stones, placed where the thumb reaches */
function fitWidth(){
  width = window.innerWidth < 620 ? 'phone' : 'wide';
  render();
}
window.addEventListener('resize', fitWidth);

/* first paint uses the language the prescription was dispensed in, then the
   patient may change it and everything follows */
/* Someone who arrived by choosing "I am a patient" has no code and nothing
   to load, so there is nothing to wait for. Show the sign-in immediately
   and synchronously rather than after a promise settles — waiting on an
   async result that will never arrive is how this ended up looking like a
   dead button. */
if(!RX_CODE || RX_CODE.length < 20){
  var g0 = document.getElementById('pgate');
  if(g0) g0.classList.remove('hidden');
}

loadLive().then(function(){
  /* A language the patient chose themselves outranks the one the
     prescription happened to be dispensed in. Someone who picked Urdu at
     the sign-in screen and was then shown English on the page had good
     reason to think the app was broken. The dispensing language is only a
     first guess, for a patient who has never chosen. */
  let chosen=null;
  try{ chosen=localStorage.getItem('adwiyati.lang'); }catch(e){}
  const l = (chosen && T[chosen]) ? chosen : liveLang();
  if(l){ lang=l; }
  render();
  /* No code in the link, or one that no longer resolves: ask who this is */
  if(!LIVE && typeof window.__openPatientGate === 'function'){
    window.__openPatientGate();
  }
});
fitWidth();

var gateLang = 'ar';
function gateT(){ return GATE[gateLang] || GATE.ar; }

function applyGateLang(code){
  gateLang = GATE[code] ? code : 'ar';
  var t = gateT(), g = document.getElementById('pgate');
  if(!g) return;
  g.setAttribute('dir', t.dir);
  g.style.fontFamily = code==='ur' ? "'Noto Nastaliq Urdu',serif"
                     : code==='bn' ? "'Noto Sans Bengali',sans-serif"
                     : code==='hi' ? "'Noto Sans Devanagari',sans-serif"
                     : code==='ja' ? "'Yu Gothic','Hiragino Sans','Noto Sans JP',sans-serif"
                     : code==='zh' ? "'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif"
                     : (t.dir==='rtl' ? "'IBM Plex Sans Arabic',sans-serif" : "'Inter',sans-serif");
  var set=function(id,v){ var e=document.getElementById(id); if(e) e.textContent=v; };
  set('pgTag',t.tag); set('pgLead1',t.lead); set('pgIdLbl',t.idL); set('pgPinLbl',t.pinL);
  set('pgGo',t.go); set('pgHome',t.back); set('pgLangNow',t.name);

(function(){
  var gate = document.getElementById('pgate');
  var msg  = document.getElementById('pgMsg');
  var nid  = '';

  function show(text, ok){
    msg.innerHTML = text ? '<div class="pgMsg'+(ok?' pgSent':'')+'">'+text+'</div>' : '';
  }
  function openGate(){
    if(!gate) gate = document.getElementById('pgate');
    if(!gate) return;
    gate.classList.remove('hidden');
    var saved=null; try{ saved=localStorage.getItem('adwiyati.lang'); }catch(e){}
    if(!saved){ var n=(navigator.language||'ar').slice(0,2).toLowerCase(); saved=GATE[n]?n:'ar'; }
    applyGateLang(saved);
    document.getElementById('pgId').focus();
  }

  /* the globe opens the same sheet the rest of the page uses */
  /* The page and the gate share one stored preference, so a patient who
     picks Urdu at sign-in still has Urdu once they are inside. */
  document.getElementById('pgLang').addEventListener('click', function(){
    var sheet=document.getElementById('langSheet');
    sheet.innerHTML='<div class="sheetInner">'+Object.keys(GATE).map(function(k){
      return '<button class="lgo'+(k===gateLang?' on':'')+'" data-gl="'+k+'" lang="'+k+'">'+
             GATE[k].name+'</button>';
    }).join('')+'</div>';
    sheet.classList.add('on');
  });
  document.getElementById('langSheet').addEventListener('click', function(e){
    var b=e.target.closest('.lgo[data-gl]');
    if(b){ applyGateLang(b.dataset.gl); document.getElementById('langSheet').classList.remove('on'); }
  });
  window.__openPatientGate = openGate;

  /* The printed PIN is the ordinary way in. Four digits are only safe
     because five wrong tries kill them, and because they are worthless
     without the number beside them on the bag (a national / iqama ID, or
     the random 4-digit number a study patient gets instead) — so the
     server counts, not the page. */
  /* A phone set to Arabic, Urdu, Hindi or Bengali may type its own digits
     (٤٦٠٣ · ۴۶۰۳ · ४६०३ · ৪৬০৩). The bag is printed in 0–9, so the page
     reads every kind of digit as 0–9 before it checks or sends anything. */

  /* ph7: the bag carries one random code — sign-in asks for that alone.
     ph8.4: the code is 5 digits; bags printed before carry 8 letters and
     digits, and both are accepted. */
  (function(){
    var C={
      ar:['اكتب الكود المطبوع على كيس دوائك.','الكود المطبوع على الكيس','اكتب الكود كاملاً كما هو مطبوع على الكيس — خمسة أرقام.','الكود غير صحيح، أو انتهت صلاحيته. راجع الصيدلية.'],
      en:['Enter the code printed on your medicine bag.','Code on your bag','Enter the full code exactly as printed on the bag — five digits.','That code is not right, or it has expired. Ask the pharmacy.'],
      ur:['اپنی دوا کے تھیلے پر چھپا کوڈ لکھیں۔','تھیلے پر چھپا کوڈ','تھیلے پر چھپا پورا کوڈ لکھیں — پانچ ہندسے۔','کوڈ درست نہیں یا اس کی مدت ختم ہو گئی۔ فارمیسی سے رابطہ کریں۔'],
      bn:['ওষুধের ব্যাগে ছাপা কোডটি লিখুন।','ব্যাগে ছাপা কোড','ব্যাগে যেমন ছাপা আছে পুরো কোডটি লিখুন — পাঁচটি সংখ্যা।','কোডটি সঠিক নয় বা মেয়াদ শেষ। ফার্মেসিতে জিজ্ঞাসা করুন।'],
      id:['Masukkan kode yang tercetak di kantong obat Anda.','Kode di kantong','Masukkan kode lengkap seperti tercetak di kantong — lima angka.','Kode tidak benar atau sudah kedaluwarsa. Tanyakan ke apotek.'],
      ms:['Masukkan kod yang dicetak pada beg ubat anda.','Kod pada beg','Masukkan kod penuh seperti yang dicetak pada beg — lima digit.','Kod tidak betul atau telah tamat tempoh. Tanya farmasi.'],
      es:['Escriba el código impreso en la bolsa de sus medicamentos.','Código de la bolsa','Escriba el código completo tal como aparece en la bolsa: cinco dígitos.','El código no es correcto o ha caducado. Consulte en la farmacia.'],
      fr:['Saisissez le code imprimé sur votre sac de médicaments.','Code sur le sac','Saisissez le code complet tel qu’il est imprimé sur le sac — cinq chiffres.','Ce code n’est pas correct ou a expiré. Adressez-vous à la pharmacie.'],
      tr:['İlaç poşetinizde yazan kodu girin.','Poşetteki kod','Kodu poşette yazdığı gibi eksiksiz girin — beş rakam.','Kod doğru değil ya da süresi dolmuş. Eczaneye danışın.'],
      de:['Geben Sie den Code ein, der auf Ihrer Arzneimitteltüte steht.','Code auf der Tüte','Geben Sie den vollständigen Code so ein, wie er auf der Tüte steht — fünf Ziffern.','Der Code ist nicht richtig oder abgelaufen. Fragen Sie in der Apotheke.'],
      ja:['お薬の袋に印刷されたコードを入力してください。','袋のコード','袋に印刷されたとおりにコード全体を入力してください（数字5桁）。','コードが正しくないか、有効期限が切れています。薬局にお問い合わせください。'],
      ru:['Введите код, напечатанный на пакете с лекарствами.','Код на пакете','Введите код полностью, как он напечатан на пакете, — пять цифр.','Код неверный или срок его действия истёк. Обратитесь в аптеку.'],
      zh:['请输入药袋上印的代码。','药袋上的代码','请按药袋上所印完整输入代码（5位数字）。','代码不正确或已过期，请咨询药房。']
    };
    for(var l in GATE){ var c=C[l]||C.en; GATE[l].lead=c[0]; GATE[l].idL=c[1]; GATE[l].eId=c[2]; GATE[l].eBad=c[3]; }
  })();
  function latinDigits(s){
    return String(s||'').replace(/[٠-٩۰-۹०-९০-৯０-９]/g, function(ch){
      var c=ch.charCodeAt(0);
      return String(c - (c>=0xFF10 ? 0xFF10 : c>=0x09E6 ? 0x09E6 : c>=0x0966 ? 0x0966 : c>=0x06F0 ? 0x06F0 : 0x0660));
    });
  }
  document.getElementById('pgGo').addEventListener('click', async function(){
    var btn=this,
        key=latinDigits(document.getElementById('pgId').value).toUpperCase().replace(/[^A-Z0-9]/g,'');
    if(!/^\d{5}$/.test(key) && key.length !== 8){ show(gateT().eId); return; }
    btn.disabled=true; btn.textContent=gateT().busy;
    try{
      var r = await rpc('patient_key_signin', { p_key:key });
      if(r && r.ok && r.rx){
        /* Navigate straight to the new address instead of rewriting the
           URL and then reloading. replaceState + reload is unreliable on
           iOS Safari: the reload can fetch the ORIGINAL url (?patient=1),
           landing the patient back on an empty sign-in form — which looked
           exactly like the code had been rejected, and is why it seemed to
           work only after several tries. An assignment is a real navigation
           and cannot be second-guessed by the browser. */
        /* this page has its own address now, so it reloads into itself */
        location.replace('patient.html?rx=' + encodeURIComponent(r.rx));
        return;
      }
      show(r && r.reason==='busy' ? gateT().eSvc : gateT().eBad);
    }catch(e){
      /* A fault in the service is not the patient's mistake, and telling
         them "wrong code" when the server never saw their code sends them
         to the pharmacy for no reason. */
      show((e && (e.status===404 || e.status===401 || e.status===403))
             ? gateT().eSvc : gateT().eNet);
      console.error('sign-in failed:', e && e.status, e && e.message);
    }
    btn.disabled=false; btn.textContent=gateT().go;
  });

  /* Ask for an emailed code.

     The previous version of this renamed the button's own id to 'pgSend'
     mid-click and then called .click() on itself — a button that changed
     identity under the user's finger and re-entered its own handler. It
     is written plainly now: one button, one id, one job. */
  document.getElementById('pgLost').addEventListener('click', function(){
    var v=latinDigits(document.getElementById('pgId').value).trim();
    if(!/^\d{4}$/.test(v) && v.length < 8){ show(gateT().eId); document.getElementById('pgId').focus(); return; }
    requestEmailedCode(v, this);
  });

  /* Going back to the front door is a deliberate act, so it asks first.
     Losing a half-typed ID to a stray tap on a phone is exactly the kind
     of small cruelty this whole project exists to avoid. */
  (function(){
    var k=document.getElementById('pgId');
    k.addEventListener('input', function(){
      var v=latinDigits(k.value).toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8);
      /* 5 digits stay as typed; an older 8-character key is shown as XXXX-XXXX */
      k.value = (/^\d*$/.test(v) && v.length<=5) || v.length<=4 ? v : v.slice(0,4)+'-'+v.slice(4);
    });
    k.addEventListener('keydown', function(e){ if(e.key==='Enter') document.getElementById('pgGo').click(); });
  })();
  document.getElementById('pgHome').addEventListener('click', function(){
    var typed=(document.getElementById('pgId').value||'').trim();
    if(typed && !confirm(gateT().leave)) return;
    /* ph7: the front door is the public site */
    location.assign('home.html');
  });

  async function requestEmailedCode(v, btn){
    var label=btn.textContent;
    btn.disabled=true; btn.textContent=gateT().busy;
    try{
      var r = await rpc('patient_request_code', { p_national_id: v });
      if(r && r.ok){
        nid = v;
        show(r.sent_to ? gateT().sent.replace('{to}', r.sent_to) : gateT().sentAny, true);
        gate.classList.add('step2');
        document.getElementById('pgCode').focus();
      } else if(r && r.reason === 'too_many'){
        show('طلبت الرمز مرات كثيرة. انتظر ساعة ثم أعد المحاولة.');
      } else {
        show(gateT().eBad);
      }
    }catch(e){
      show(gateT().eNet);
    }
    btn.disabled=false; btn.textContent=label;
  }

  document.getElementById('pgVerify').addEventListener('click', async function(){
    var btn=this, c=latinDigits(document.getElementById('pgCode').value).trim();
    if(c.length !== 6){ show('الرمز ستة أرقام.'); return; }
    btn.disabled=true; btn.textContent='جارٍ التحقق…';
    try{
      var r = await rpc('patient_verify_code', { p_national_id: nid, p_code: c });
      if(r && r.ok && r.rx){
        /* replace the address so a refresh keeps them signed in, and so
           the link they may bookmark is the one that works */
        var url = location.pathname + '?rx=' + encodeURIComponent(r.rx);
        location.replace(url);
        return;
      }
      show(r && r.reason === 'locked'  ? 'أُغلق الرمز بعد محاولات كثيرة. اطلب رمزاً جديداً.'
         : r && r.reason === 'expired' ? 'انتهت صلاحية الرمز. اطلب رمزاً جديداً.'
         : 'الرمز غير صحيح.');
    }catch(e){
      show('تعذّر الاتصال. أعد المحاولة.');
    }
    btn.disabled=false; btn.textContent='دخول';
  });

  document.getElementById('pgAgain').addEventListener('click', function(){
    gate.classList.remove('step2'); show(''); nid='';
    document.getElementById('pgId').focus();
  });
})();
