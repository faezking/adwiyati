<script>
/* =====================================================================
   A real QR code, in about a hundred lines.

   Byte mode, error correction level M, versions 1 to 10 — enough for any
   link this page will ever hold, and M means a scuffed screen or a bad
   angle still reads. Written out rather than pulled from a CDN because
   this page must work with no network beyond its own origin.
===================================================================== */
var QRM = (function(){
  /* --- GF(256), the field Reed–Solomon lives in ----------------------- */
  var EXP = new Uint8Array(512), LOG = new Uint8Array(256);
  for(var i=0, x=1; i<255; i++){ EXP[i]=x; LOG[x]=i; x<<=1; if(x&256) x^=0x11d; }
  for(var i=255;i<512;i++) EXP[i]=EXP[i-255];
  function mul(a,b){ return (a===0||b===0) ? 0 : EXP[LOG[a]+LOG[b]]; }

  function rsGen(n){
    var p=[1];
    for(var i=0;i<n;i++){
      var q=new Array(p.length+1).fill(0);
      for(var j=0;j<p.length;j++){ q[j]^=mul(p[j],1); q[j+1]^=mul(p[j],EXP[i]); }
      p=q;
    }
    return p;
  }
  function rsEnc(data, n){
    var g=rsGen(n), r=new Array(n).fill(0);
    for(var i=0;i<data.length;i++){
      var f=data[i]^r[0];
      r.shift(); r.push(0);
      for(var j=0;j<n;j++) r[j]^=mul(g[j+1],f);
    }
    return r;
  }

  /* --- capacity tables, level M, versions 1..10 ----------------------- */
  var DATA=[0,16,28,44,64,86,108,124,154,182,216];
  var ECPB=[0,10,16,26,18,24,16,18,22,22,26];
  var BLOCKS=[null,[[1,16]],[[1,28]],[[1,44]],[[2,32]],[[2,43]],[[4,27]],
              [[4,31]],[[2,38],[2,39]],[[3,36],[2,37]],[[4,43],[1,44]]];
  var ALIGN=[null,[],[6,18],[6,22],[6,26],[6,30],[6,34],
             [6,22,38],[6,24,42],[6,26,46],[6,28,50]];

  /* --- BCH, for the format and version strips ------------------------- */
  function bch(v, poly, len){
    var d=v<<(len);
    while(bits(d) - 1 >= bits(poly) - 1) d ^= poly << (bits(d)-bits(poly));
    return d;
  }
  function bits(n){ var b=0; while(n){ b++; n>>>=1; } return b; }
  function formatBits(mask){                 // level M = 00
    var v=(0<<3)|mask;                       // 0b00 for M
    var d=(v<<10) | bch(v, 0x537, 10);
    return d ^ 0x5412;
  }
  function versionBits(ver){
    return (ver<<12) | bch(ver, 0x1f25, 12);
  }

  /* --- build ---------------------------------------------------------- */
  function encode(text){
    var bytes = new TextEncoder().encode(text);

    var ver=0;
    for(var v=1; v<=10; v++){
      var cclen = v<10 ? 8 : 16;
      var need = 4 + cclen + bytes.length*8;
      if(need <= DATA[v]*8){ ver=v; break; }
    }
    if(!ver) throw new Error('too long for version 10');

    var cclen = ver<10 ? 8 : 16;
    var bitsArr=[];
    function put(val,len){ for(var i=len-1;i>=0;i--) bitsArr.push((val>>i)&1); }
    put(4,4); put(bytes.length,cclen);
    for(var i=0;i<bytes.length;i++) put(bytes[i],8);

    var cap=DATA[ver]*8;
    for(var i=0;i<4 && bitsArr.length<cap;i++) bitsArr.push(0);
    while(bitsArr.length%8) bitsArr.push(0);
    var pads=[0xEC,0x11], pi=0;
    var codewords=[];
    for(var i=0;i<bitsArr.length;i+=8){
      var b=0; for(var j=0;j<8;j++) b=(b<<1)|bitsArr[i+j];
      codewords.push(b);
    }
    while(codewords.length<DATA[ver]) codewords.push(pads[pi++%2]);

    /* split into blocks, add parity to each, then interleave */
    var groups=[], ecs=[], off=0, n=ECPB[ver];
    BLOCKS[ver].forEach(function(g){
      for(var k=0;k<g[0];k++){
        var d=codewords.slice(off, off+g[1]); off+=g[1];
        groups.push(d); ecs.push(rsEnc(d,n));
      }
    });
    var out=[], maxD=Math.max.apply(null, groups.map(function(g){return g.length;}));
    for(var i=0;i<maxD;i++) groups.forEach(function(g){ if(i<g.length) out.push(g[i]); });
    for(var i=0;i<n;i++) ecs.forEach(function(e){ out.push(e[i]); });

    return {ver:ver, cw:out};
  }

  function matrix(text){
    var e=encode(text), ver=e.ver, size=ver*4+17;
    var m=[], res=[];
    for(var y=0;y<size;y++){ m.push(new Array(size).fill(null)); res.push(new Array(size).fill(false)); }

    function put(x,y,v,reserve){ if(x<0||y<0||x>=size||y>=size) return;
      m[y][x]=v?1:0; if(reserve) res[y][x]=true; }

    function finder(cx,cy){
      for(var dy=-1;dy<=7;dy++) for(var dx=-1;dx<=7;dx++){
        var x=cx+dx, y=cy+dy;
        if(x<0||y<0||x>=size||y>=size) continue;
        var on = (dx>=0&&dx<=6&&(dy===0||dy===6)) || (dy>=0&&dy<=6&&(dx===0||dx===6))
              || (dx>=2&&dx<=4&&dy>=2&&dy<=4);
        put(x,y,on,true);
      }
    }
    finder(0,0); finder(size-7,0); finder(0,size-7);

    for(var i=8;i<size-8;i++){ var on=(i%2===0); put(i,6,on,true); put(6,i,on,true); }

    ALIGN[ver].forEach(function(cx){
      ALIGN[ver].forEach(function(cy){
        if((cx<9&&cy<9)||(cx<9&&cy>size-10)||(cx>size-10&&cy<9)) return;
        for(var dy=-2;dy<=2;dy++) for(var dx=-2;dx<=2;dx++)
          put(cx+dx, cy+dy, Math.max(Math.abs(dx),Math.abs(dy))!==1, true);
      });
    });

    put(8, size-8, 1, true);                       // the dark module

    /* the two format strips are reserved, never the timing modules they
       run alongside — writing over (8,6) and (6,8) breaks the ruler the
       scanner measures the grid with */
    for(var i=0;i<9;i++){ if(i!==6){ put(i,8,0,true); put(8,i,0,true); } }
    for(var i=0;i<8;i++){ put(size-1-i,8,0,true); put(8,size-1-i,0,true); }

    if(ver>=7){
      var vb=versionBits(ver);
      for(var i=0;i<18;i++){
        var bit=(vb>>i)&1, a=Math.floor(i/3), b=i%3;
        put(a, size-11+b, bit, true);
        put(size-11+b, a, bit, true);
      }
    }

    /* zigzag placement, two columns at a time, skipping the timing column */
    var cw=e.cw, bit=0, up=true;
    for(var col=size-1; col>0; col-=2){
      if(col===6) col--;
      for(var r=0;r<size;r++){
        var y = up ? size-1-r : r;
        for(var c=0;c<2;c++){
          var x=col-c;
          if(res[y][x]) continue;
          var v=0;
          if(bit < cw.length*8) v=(cw[bit>>3] >> (7-(bit&7))) & 1;
          m[y][x]=v; bit++;
        }
      }
      up=!up;
    }

    function maskFn(k,x,y){
      switch(k){
        case 0: return (y+x)%2===0;
        case 1: return y%2===0;
        case 2: return x%3===0;
        case 3: return (y+x)%3===0;
        case 4: return (Math.floor(y/2)+Math.floor(x/3))%2===0;
        case 5: return (y*x)%2 + (y*x)%3 === 0;
        case 6: return ((y*x)%2 + (y*x)%3)%2===0;
        default:return ((y+x)%2 + (y*x)%3)%2===0;
      }
    }

    function penalty(g){
      var p=0, n=g.length;
      for(var y=0;y<n;y++){
        var run=1;
        for(var x=1;x<n;x++){
          if(g[y][x]===g[y][x-1]) run++; else { if(run>=5) p+=3+(run-5); run=1; }
        }
        if(run>=5) p+=3+(run-5);
      }
      for(var x=0;x<n;x++){
        var run=1;
        for(var y=1;y<n;y++){
          if(g[y][x]===g[y-1][x]) run++; else { if(run>=5) p+=3+(run-5); run=1; }
        }
        if(run>=5) p+=3+(run-5);
      }
      for(var y=0;y<n-1;y++) for(var x=0;x<n-1;x++){
        var s=g[y][x]+g[y][x+1]+g[y+1][x]+g[y+1][x+1];
        if(s===0||s===4) p+=3;
      }
      var pat=[1,0,1,1,1,0,1,0,0,0,0];
      function look(get){
        for(var y=0;y<n;y++) for(var x=0;x+10<n;x++){
          var ok=true;
          for(var k=0;k<11;k++) if(get(y,x+k)!==pat[k]){ ok=false; break; }
          if(ok) p+=40;
        }
      }
      look(function(y,x){ return g[y][x]; });
      look(function(y,x){ return g[x][y]; });
      var dark=0;
      for(var y=0;y<n;y++) for(var x=0;x<n;x++) dark+=g[y][x];
      p += Math.floor(Math.abs(dark*100/(n*n) - 50)/5)*10;
      return p;
    }

    var best=null, bestP=Infinity;
    for(var k=0;k<8;k++){
      var g=[];
      for(var y=0;y<size;y++){
        g.push(new Array(size));
        for(var x=0;x<size;x++)
          g[y][x] = res[y][x] ? m[y][x] : (m[y][x] ^ (maskFn(k,x,y)?1:0));
      }
      var fb=formatBits(k);
      for(var i=0;i<15;i++){
        var b=(fb>>i)&1;
        if(i<6)       g[i][8]=b;
        else if(i<8)  g[i+1][8]=b;
        else if(i===8)g[8][7]=b;
        else          g[8][14-i]=b;
        if(i<8)       g[8][size-1-i]=b;
        else          g[size-15+i][8]=b;
      }
      g[size-8][8]=1;
      var p=penalty(g);
      if(p<bestP){ bestP=p; best=g; }
    }
    return best;
  }

  return matrix;
})();

function svcT(){ return SVC[lang] || SVC.ar; }

/* ---------------------------------------------------------------------------
   LISTEN

   Urdu and Bengali are the two languages in this project with no official
   leaflet anywhere in the world, so their patients get the least written
   material — and they are also the patients least likely to read the little
   that exists. Reading the directions aloud costs nothing and is the one
   channel that does not depend on literacy at all.

   The button appears only when the phone actually holds a voice for the
   language being shown. An offer to read aloud that then says nothing, or
   that reads Urdu with an English voice, is worse than no button: the patient
   concludes the page is broken and stops trusting the rest of it. So the
   check is for a real installed voice, and silence is the honest default.
   --------------------------------------------------------------------------- */
var LISTEN_LBL = {"ar": "استمع", "en": "Listen", "ur": "سنیں", "bn": "শুনুন", "hi":"सुनें", "tl":"Makinig", "id": "Dengarkan", "ms":"Dengar", "es": "Escuchar", "fr": "Écouter", "tr": "Dinle", "de": "Anhören", "ja": "聞く", "ru": "Слушать", "zh": "收听"};
var SPOKEN = [];          /* what each card says, in card order */
var voicesRetried = false;

function voiceFor(code){
  if(typeof speechSynthesis === 'undefined') return null;
  var want = String(LOCALE[code] || code).toLowerCase().slice(0,2);
  var list = speechSynthesis.getVoices() || [];
  for(var i=0;i<list.length;i++){
    if(String(list[i].lang||'').toLowerCase().slice(0,2) === want) return list[i];
  }
  return null;
}

/* Each line already ends with the punctuation its own language uses, so a
   full stop is added only where one is missing. Without this the reader says
   "...for 7 days.. If you miss a dose", and the stumble is audible. */
function sayJoin(parts){
  return parts.filter(Boolean).map(function(s){
    s = String(s).trim();
    return /[.。！？!?؟۔।]$/.test(s) ? s : s + '.';
  }).join(' ');
}

function speakCard(i){
  var item = SPOKEN[i];
  var text = item && item.text;
  if(!text || typeof speechSynthesis === 'undefined') return;
  var v = voiceFor(item.lang || lang);
  if(!v) return;
  speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(text);
  u.voice = v; u.lang = v.lang;
  u.rate = 0.85;            /* slower than default: this is dosing, not prose */
  speechSynthesis.speak(u);
}

/* Voices arrive asynchronously on most phones, so the first render can happen
   before the list exists. One re-render when they land is enough. */
if(typeof speechSynthesis !== 'undefined'){
  speechSynthesis.onvoiceschanged = function(){
    if(voicesRetried) return;
    voicesRetried = true;
    render();   /* a card may be in a language other than the interface's */
  };
}

document.addEventListener('click', function(e){
  var b = e.target.closest ? e.target.closest('[data-say]') : null;
  if(b) speakCard(parseInt(b.getAttribute('data-say'), 10));
});
function esc(s){ return String(s==null?'':s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
var LOCALE={ar:'ar',en:'en-GB',ur:'ur',bn:'bn', hi:"hi-IN", tl:"fil-PH",id:'id', ms:"ms-MY",es:'es',fr:"fr-FR",tr:"tr-TR",de:"de-DE",ja:"ja-JP",ru:"ru-RU",zh:"zh-CN"};
function when(ts){
  /* the date belongs to the language the page is read in — an Arabic page
     stamping "Aug 22, 02:10 PM" on the patient's own message writes half
     the screen in a script they may not read */
  try{ return new Date(ts).toLocaleString(LOCALE[lang]||'ar',
    {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}); }catch(e){ return ''; }
}

var QA = null;      // this patient's questions and any answers
var RF = null;      // the newest refill request, if there is one
var SVCMSG = {};    // transient one-line feedback under each control

async function loadServices(){
  if(!LIVE) return;
  try{ var q = await rpc('my_questions', {p_code: RX_CODE}); QA = Array.isArray(q)?q:[]; }
  catch(e){ QA = null; }
  try{ var r = await rpc('my_refill', {p_code: RX_CODE}); RF = (Array.isArray(r)&&r.length)?r[0]:null; }
  catch(e){ RF = null; }
  render();
}

/* ---- the conversation ------------------------------------------------ */
function paintAsk(){
  var s = svcT(), ta = document.getElementById('ta'), btn = document.getElementById('askBtn');
  var thread = document.querySelector('.ask .thread');
  if(!thread) return;

  if(!LIVE){
    if(ta) ta.readOnly = true;
    if(btn){ btn.disabled = true; btn.title = s.demo; }
    thread.innerHTML = '<div class="msg rx"><div>'+esc(s.demo)+'</div></div>';
    return;
  }
  if(ta) ta.readOnly = false;
  if(btn) btn.disabled = false;

  var html = '';
  if(QA && QA.length){
    QA.forEach(function(q){
      html += '<div class="msg"><div class="who2">'+esc(s.you)+' · '+esc(when(q.asked_at))+'</div>'+
              '<div dir="auto">'+esc(q.question)+'</div></div>';
      if(q.answer){
        html += '<div class="msg rx"><div class="who2">'+esc(s.ph)+' · '+esc(when(q.answered_at))+'</div>'+
                '<div dir="auto">'+esc(q.answer)+'</div></div>';
      }else{
        html += '<div class="msg rx"><div class="who2">'+esc(s.pending)+'</div><div>…</div></div>';
      }
    });
  }else{
    html = '<div class="msg rx"><div>'+esc(s.none)+'</div></div>';
  }
  if(SVCMSG.ask) html += '<div class="msg rx"><div>'+esc(SVCMSG.ask)+'</div></div>';
  thread.innerHTML = html;
}

async function sendQuestion(){
  var s = svcT(), ta = document.getElementById('ta'), btn = document.getElementById('askBtn');
  if(!LIVE || !ta) return;
  var text = (ta.value||'').trim();
  if(!text) { ta.focus(); return; }
  btn.disabled = true; SVCMSG.ask = s.sending; paintAsk();
  try{
    var ok = await rpc('ask_pharmacist', {p_code: RX_CODE, p_question: text, p_lang: lang});
    if(ok === true){
      ta.value = '';
      SVCMSG.ask = s.sent;
      var q = await rpc('my_questions', {p_code: RX_CODE});
      QA = Array.isArray(q)?q:QA;
    }else{
      SVCMSG.ask = s.failMany;
    }
  }catch(e){ SVCMSG.ask = s.failErr; }
  btn.disabled = false; paintAsk();
  setTimeout(function(){ SVCMSG.ask=''; paintAsk(); }, 6000);
}

/* ---- the refill ------------------------------------------------------ */
function paintRefill(){
  var s = svcT(), btn = document.getElementById('refillBtn'), note = document.getElementById('refillNote');
  var st = ['s1','s2','s3'].map(function(id){ return document.getElementById(id); });
  if(!btn) return;

  if(!LIVE){ btn.disabled = true; btn.title = s.demo; return; }
  btn.disabled = false;

  /* the three stones light up to where the request has actually reached */
  var reached = 0, line = '';
  if(RF){
    if(RF.status === 'new')            { reached = 1; line = s.rNew; }
    else if(RF.status === 'with_dr')   { reached = 2; line = s.rDr; }
    else if(RF.status === 'ready')     { reached = 3; line = s.rReady; }
    else if(RF.status === 'declined')  { reached = 1; line = s.rDeclined; }
  }
  st.forEach(function(e,i){ if(e) e.classList.toggle('on', i < reached); });
  if(RF) btn.disabled = true;
  if(note) note.textContent = SVCMSG.refill || line || (T[lang]||T.ar).refillNote;
}

async function askRefill(){
  var s = svcT(), btn = document.getElementById('refillBtn');
  if(!LIVE) return;
  btn.disabled = true; SVCMSG.refill = s.rSending; paintRefill();
  try{
    var ok = await rpc('request_refill', {p_code: RX_CODE});
    if(ok === true){
      var r = await rpc('my_refill', {p_code: RX_CODE});
      RF = (Array.isArray(r)&&r.length)?r[0]:{status:'new'};
      SVCMSG.refill = '';
    }else{ SVCMSG.refill = s.failErr; btn.disabled = false; }
  }catch(e){ SVCMSG.refill = s.failErr; btn.disabled = false; }
  paintRefill();
}

/* ---- keeping the page ------------------------------------------------ */
async function mailMyPage(){
  var s = svcT(), btn = document.getElementById('mailBtn'), note = document.getElementById('keepNote');
  if(!LIVE){ if(note) note.textContent = s.demo; return; }
  btn.disabled = true; if(note) note.textContent = s.mSending;
  try{
    var r = await rpc('email_my_page', {p_code: RX_CODE});
    if(r && r.ok) note.textContent = s.mSent.replace('{to}', r.sent_to || '');
    else if(r && r.reason === 'no_email')  note.textContent = s.mNone;
    else if(r && r.reason === 'too_many')  note.textContent = s.mMany;
    else note.textContent = s.mFail;
  }catch(e){ if(note) note.textContent = s.mFail; }
  btn.disabled = false;
}

var deferredInstall = null;
window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); deferredInstall = e; });
async function addToHome(){
  var s = svcT(), note = document.getElementById('keepNote');
  if(deferredInstall){ deferredInstall.prompt(); deferredInstall = null; return; }
  var ios = /iPad|iPhone|iPod/.test(navigator.userAgent);
  if(note) note.textContent = ios ? s.homeIOS : s.homeDroid;
}

/* ---- the QR code -----------------------------------------------------
   It used to be a decorative grid of squares. A patient who pointed a
   second phone at it got nothing. It now encodes this page's address, so
   the code on the bag and the code on the screen do the same thing.
--------------------------------------------------------------------- */
function realQrSvg(text, px){
  var m;
  try{ m = qrMatrix(text); }catch(e){ return ''; }
  var n = m.length, q = 2, size = n + q*2, cell = 1, out = '';
  for(var y=0;y<n;y++) for(var x=0;x<n;x++)
    if(m[y][x]) out += '<rect x="'+(x+q)+'" y="'+(y+q)+'" width="1" height="1"/>';
  return '<svg width="'+px+'" height="'+px+'" viewBox="0 0 '+size+' '+size+'" '+
         'shape-rendering="crispEdges" style="flex-shrink:0" role="img">'+
         '<rect width="'+size+'" height="'+size+'" fill="#fff"/>'+
         '<g fill="#3A2E22">'+out+'</g></svg>';
}

function paintKeep(){
  var s = svcT(), qr = document.getElementById('qr'), note = document.getElementById('qrNote');
  var mail = document.getElementById('mail');
  if(mail){ mail.readOnly = true; mail.style.display = 'none'; }   // we send to the address on file, never one typed here
  if(!qr) return;
  if(LIVE){
    qr.innerHTML = realQrSvg(location.origin + location.pathname + '?rx=' + RX_CODE, 168);
    if(note) note.textContent = s.qrLive;
  }
}

 zh:{t:'服药提醒',lead:'在疗程结束前，每到服药时间我们都会给您发送邮件。',priv:'邮件中会写明药品名称和剂量。您可以随时停止。',ph:'您的电子邮箱',on:'提醒我',onT:'提醒已开启',to:'每到服药时间发送至 {to}。',change:'更换邮箱',stop:'停止提醒',cancel:'取消',saving:'正在保存…',bad:'这个邮箱地址似乎不正确。',many:'今天更改次数过多。请明天再试，或询问药剂师。',fail:'无法保存。请检查网络后重试。',stopped:'提醒已关闭。您可以随时重新开启。',saved:'设置完成。第一条提醒将在您下次服药时间发送。'}
};
function rmT(){ return RMT[lang] || RMT.en; }
var RS = null;                       // the reminder state from the server
var RM = { editing:false, busy:false, msg:'', err:false, draft:'' };
var BELL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>';
var TICK = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';
var EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

async function loadReminders(){
  if(!LIVE) return;
  try{ RS = await rpc('my_reminders', {p_code: RX_CODE}); }catch(e){ RS = null; }
  paintRemind();
}

function paintRemind(){
  var box = document.getElementById('remind');
  if(!box) return;
  /* only where there is something to remind about: a live page, a course
     still running, and a medicine taken at set times */
  if(!LIVE || !RS || !RS.ok || !RS.active || !RS.remindable){ box.hidden = true; return; }
  var s = rmT();
  /* keep what the patient is typing across a repaint (a language change, the
     services arriving) */
  var cur = document.getElementById('rmIn');
  if(cur && !RM.clear) RM.draft = cur.value;
  RM.clear = false;
  var head = '<div class="rh"><span class="bell">'+BELL+'</span><span>'+esc(s.t)+'</span></div>';
  var msg = '<div class="rmsg'+(RM.err?' err':'')+'" role="status">'+esc(RM.msg||'')+'</div>';
  var html;
  if(RS.on && !RM.editing){
    html = head +
      '<div class="rok">'+TICK+'<div><b>'+esc(s.onT)+'</b>'+
        '<span>'+esc(s.to).replace('{to}', '<span class="to" dir="ltr">'+esc(RS.email||'')+'</span>')+'</span></div></div>'+
      '<div class="racts">'+
        '<button class="btn ghost" id="rmChange" type="button">'+esc(s.change)+'</button>'+
        '<button class="btn ghost" id="rmStop" type="button">'+esc(s.stop)+'</button>'+
      '</div>' + msg;
  }else{
    html = head +
      '<p class="rl">'+esc(s.lead)+'</p>'+
      '<p class="rp">'+esc(s.priv)+'</p>'+
      '<form id="rmForm" novalidate>'+
        '<input class="in" id="rmIn" type="email" dir="ltr" inputmode="email" autocomplete="email" '+
          'autocapitalize="off" spellcheck="false" enterkeyhint="done" maxlength="254" '+
          'placeholder="'+esc(s.ph)+'" aria-label="'+esc(s.ph)+'">'+
        '<div class="racts">'+
          '<button class="btn" id="rmOn" type="submit">'+BELL.replace('<svg ','<svg width="20" height="20" ')+esc(s.on)+'</button>'+
          (RM.editing ? '<button class="btn ghost" id="rmCancel" type="button">'+esc(s.cancel)+'</button>' : '')+
        '</div>'+
      '</form>' + msg;
  }
  box.innerHTML = html;
  box.hidden = false;
  var inp = document.getElementById('rmIn');
  if(inp){ inp.value = RM.draft || ''; }
  box.querySelectorAll('button').forEach(function(b){ b.disabled = RM.busy; });
}

function rmSay(text, err){ RM.msg = text || ''; RM.err = !!err; }

async function rmTurnOn(){
  var s = rmT(), inp = document.getElementById('rmIn');
  var v = ((inp && inp.value) || '').trim();
  if(!EMAIL_RE.test(v)){
    rmSay(s.bad, true); RM.draft = v; paintRemind();
    var i2 = document.getElementById('rmIn'); if(i2){ i2.classList.add('bad'); i2.focus(); }
    return;
  }
  RM.busy = true; RM.draft = v; rmSay(s.saving); paintRemind();
  try{
    var r = await rpc('set_my_reminders', {p_code: RX_CODE, p_email: v, p_on: true});
    if(r && r.ok){
      RS.on = true; RS.email = r.email; RS.pending = r.pending;
      RM.editing = false; RM.draft = ''; RM.clear = true; rmSay(s.saved);
    }else if(r && r.reason === 'bad_email'){ rmSay(s.bad, true); }
    else if(r && r.reason === 'too_many'){ rmSay(s.many, true); }
    else if(r && r.reason === 'not_needed'){ RS.remindable = false; }
    else { rmSay(s.fail, true); }
  }catch(e){ rmSay(s.fail, true); }
  RM.busy = false; paintRemind();
}

async function rmTurnOff(){
  var s = rmT();
  RM.busy = true; rmSay(s.saving); paintRemind();
  try{
    var r = await rpc('set_my_reminders', {p_code: RX_CODE, p_email: null, p_on: false});
    if(r && r.ok){ RS.on = false; RS.email = null; RM.editing = false; rmSay(s.stopped); }
    else if(r && r.reason === 'too_many'){ rmSay(s.many, true); }
    else { rmSay(s.fail, true); }
  }catch(e){ rmSay(s.fail, true); }
  RM.busy = false; paintRemind();
}

document.addEventListener('submit', function(e){
  if(e.target && e.target.id === 'rmForm'){ e.preventDefault(); if(!RM.busy) rmTurnOn(); }
});
document.addEventListener('click', function(e){
  var t = e.target;
  if(RM.busy) return;
  if(t.closest('#rmChange')){ RM.editing = true; RM.draft = ''; rmSay(''); paintRemind();
    var i = document.getElementById('rmIn'); if(i) i.focus(); }
  else if(t.closest('#rmCancel')){ RM.editing = false; RM.draft = ''; rmSay(''); paintRemind(); }
  else if(t.closest('#rmStop')){ rmTurnOff(); }
});
document.addEventListener('input', function(e){
  if(e.target && e.target.id === 'rmIn'){ e.target.classList.remove('bad'); if(RM.err){ RM.err=false; RM.msg='';
    var m=document.querySelector('#remind .rmsg'); if(m){ m.textContent=''; m.classList.remove('err'); } } }
});

/* ---- wiring ---------------------------------------------------------- */
document.addEventListener('click', function(e){
  var t = e.target;
  if(t.closest('#askBtn'))    { e.preventDefault(); sendQuestion(); }
  else if(t.closest('#refillBtn')){ e.preventDefault(); askRefill(); }
  else if(t.closest('#mailBtn')) { e.preventDefault(); mailMyPage(); }
  else if(t.closest('#homeBtn')) { e.preventDefault(); addToHome(); }
});

var __renderBase = render, __svcLoaded = false;
render = function(){
  __renderBase.apply(this, arguments);
  /* the prescription arrives one promise later than this file runs, so the
     services load on the first paint that actually has it. Asking earlier is
     what left the conversation showing "no questions yet" above a thread
     that already existed. */
  if(LIVE && !__svcLoaded){ __svcLoaded = true; loadServices(); loadReminders(); }
  try{ paintAsk(); paintRefill(); paintKeep(); paintRemind(); }catch(e){ console.warn('services:', e); }
};

render();

</script>
